# WebDAV problems are almost never visible in a normal access log: the verb and
# the status are identical whether a client asked for a directory's contents or
# just the directory itself. Depth is the header that distinguishes them, so it
# is logged for /dav only. The User-Agent tells Obsidian on the phone apart from
# Obsidian on the laptop when both are syncing the same vault.
log_format dav '$request_method $uri depth=$http_depth -> $status  ua="$http_user_agent"';

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store";
    }

    # Fonts are the one thing here worth caching hard: they never change, and
    # re-fetching them on every launch is latency the page does not need.
    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # Character artwork. Needs its own location purely so a missing file 404s:
    # the catch-all below is try_files ... /index.html, which answers 200 with
    # the page itself, and the avatar loader would then be probing for images
    # by decoding a 140 KB HTML document four times on every launch.
    #
    # Cached for a week rather than a year — unlike the fonts, this is art the
    # user is expected to iterate on.
    location /avatar/ {
        add_header Cache-Control "public, max-age=604800";
        try_files $uri =404;
        access_log off;
    }

    # Chat goes through the agent router, which picks a backend from the
    # "agent" field and falls back to llama on any failure. Deferred DNS via a
    # variable means the page degrades to plain local chat if the container is
    # absent, instead of nginx refusing to start.
    location = /v1/chat/completions {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $remote_upstream http://remote:5003/v1/chat/completions;
        proxy_pass $remote_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Diagnostic sink: the page posts speech-recognition lifecycle events here
    # so a failure that only happens on the phone can be read off the server.
    location = /diag {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $diag_upstream http://remote:5003/diag;
        proxy_pass $diag_upstream;
        proxy_read_timeout 15s;
    }

    # Obsidian's sync target. Same origin and port as everything else, so it
    # rides the existing Tailscale route with no extra exposure.
    #
    # Every WebDAV verb has to be allowed through explicitly: proxy_pass will
    # forward them, but the client also needs Destination and Depth headers
    # preserved for MOVE and PROPFIND to work at all.
    location /dav {
        access_log /var/log/nginx/access.log dav;

        resolver 127.0.0.11 ipv6=off valid=10s;
        set $dav_upstream http://webdav:6065;
        proxy_pass $dav_upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Destination $http_destination;
        proxy_set_header Depth $http_depth;

        client_max_body_size 64m;      # a vault attachment, not a video
        proxy_read_timeout 120s;
    }

    # Offline reverse geocode: a fix in, a place name out.
    location = /place {
        resolver 127.0.0.11 ipv6=off valid=10s;
        # $is_args$args is load-bearing: proxy_pass through a VARIABLE does not
        # carry the query string automatically the way a literal URL does, so
        # without it lat/lon never arrive and the endpoint 400s.
        set $place_upstream http://remote:5003/place$is_args$args;
        proxy_pass $place_upstream;
        proxy_read_timeout 20s;
    }

    # Document upload: a file in, a note in the vault out.
    location = /ingest {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $ingest_upstream http://remote:5003/ingest;
        proxy_pass $ingest_upstream;

        # A document, not a video. The router caps it again server-side.
        client_max_body_size 12m;
        proxy_request_buffering off;
        proxy_read_timeout 120s;
    }

    # Health. Longer than a normal proxy read because it asks llama to
    # generate a token, and a cold model can take a few seconds to answer the
    # first one — timing out here would report the model dead precisely when it
    # is only waking up.
    location = /health {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $health_upstream http://remote:5003/health;
        proxy_pass $health_upstream;
        proxy_read_timeout 60s;
        access_log off;
    }

    # Maintenance. Long read timeout because rebuilding the hub layer over 745
    # notes takes a while and the request is synchronous by design — the user
    # asked for something to happen and wants to be told whether it did.
    location = /maintain {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $maint_upstream http://remote:5003/maintain;
        proxy_pass $maint_upstream;
        proxy_read_timeout 180s;
    }

    # Research: search the vault and the offline Wikipedia, write the answer up
    # as a note, stream it back. Same SSE treatment as the chat endpoint —
    # buffering here would hold the whole answer until it finished, which on
    # the local model is over a minute of blank screen.
    location = /research {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $research_upstream http://remote:5003/research;
        proxy_pass $research_upstream;

        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        # Generous: three article fetches, then the local model writing 900
        # tokens at 8 tok/s. It is slow by design, not stuck.
        proxy_read_timeout 900s;
        proxy_send_timeout 900s;
    }

    # Vault search, server-side.
    location = /recall {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $recall_upstream http://remote:5003/recall$is_args$args;
        proxy_pass $recall_upstream;
        proxy_read_timeout 20s;
    }

    # Which agents exist, which have keys, and why one last failed.
    location = /agents {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $agents_upstream http://remote:5003/agents;
        proxy_pass $agents_upstream;
        proxy_read_timeout 30s;
        add_header Cache-Control "no-store" always;
    }

    # Everything else on /v1/ stays with llama directly.
    # Same origin means no CORS, and one port to expose via tailscale serve.
    location /v1/ {
        proxy_pass http://llama:8080;

        # Streaming (SSE) needs every buffer off or tokens arrive in one lump.
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;

        # Generation on a 2-core CPU is slow; do not time out mid-answer.
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Memory store. nginx here is built --with-http_dav_module, so a PUT-able
    # JSON file costs no extra container and no extra RAM. Server-side rather
    # than localStorage so memories survive clearing site data and follow the
    # user across devices.
    location /mem/ {
        root /var/lib/orb;              # -> /var/lib/orb/mem/*.md
        dav_methods PUT DELETE;
        create_full_put_path on;
        dav_access user:rw group:rw all:r;
        client_max_body_size 2m;

        # JSON directory listing lets the page discover notes without a
        # database or an index file to keep in sync. Drop a .md in the folder
        # and it is picked up on next load.
        autoindex on;
        autoindex_format json;

        add_header Cache-Control "no-store" always;
    }

    # Offline Wikipedia (kiwix-serve). Same deferred-resolution trick as the
    # others, so the page degrades to plain chat if the container is absent.
    # rewrite...break is required because proxy_pass through a variable cannot
    # carry a URI of its own.
    location /wiki/ {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $wiki_upstream http://kiwix:8080;
        rewrite ^/wiki/(.*)$ /$1 break;
        proxy_pass $wiki_upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 60s;
    }

    # Text-to-speech (Piper). Same request-time resolution trick as /stt below,
    # so the page falls back to the phone's built-in voice with a 502 rather
    # than nginx refusing to start when the piper container is absent.
    # TTS: local Piper. edge-tts was removed — undocumented endpoint, and it
    # sent reply text off the network for no benefit that survived listening.
    location = /tts {
        resolver 127.0.0.11 ipv6=off valid=10s;
        # Piper's Flask app serves a web UI at "/" and synthesis at
        # "/synthesize" (POST, JSON body {"text": "..."}). Hitting "/" returns
        # HTML, not audio — worth knowing if this ever looks like it "works"
        # but plays nothing.
        set $tts_upstream http://piper:5000/synthesize;
        proxy_pass $tts_upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 120s;
        proxy_buffering off;

        # Piper returns the WAV labelled "text/html". Correct it here so the
        # endpoint is honest for any consumer, not just this page.
        proxy_hide_header Content-Type;
        add_header Content-Type "audio/wav" always;
    }

    # Speech-to-text. Unused on Safari, which dictates on the device.
    #
    # proxy_pass with a literal hostname is resolved once at startup, so nginx
    # would refuse to boot with "host not found in upstream" whenever the
    # whisper container is not running. Going through a variable defers
    # resolution to request time: /stt returns 502 if whisper is absent, and
    # everything else keeps working.
    location = /stt {
        resolver 127.0.0.11 ipv6=off valid=10s;
        set $stt_upstream http://whisper:8080/inference;
        proxy_pass $stt_upstream;

        proxy_http_version 1.1;
        proxy_read_timeout 300s;
        client_max_body_size 25m;   # 25 s of 16 kHz mono WAV is ~800 KB
    }
}
