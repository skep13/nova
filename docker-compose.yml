services:
  llama:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: orb-llama
    restart: unless-stopped
    volumes:
      # /root/.cache/huggingface, NOT /root/.cache/llama.cpp. The volume was
      # mounted at the latter and llama.cpp caches to the former, so it held
      # nothing and every container recreate re-downloaded 1.8 GB into the
      # writable layer — where it was then thrown away with the container.
      - models:/root/.cache/huggingface
    # Upgraded from Qwen2.5-1.5B when the host went 4 GB -> 8 GB.
    # Measured on this hardware: 3B = 8.3 tok/s, 1.5B = 16.5 tok/s — exactly
    # half. Kept anyway, because throughput is not the binding constraint:
    # 8.3 tok/s is ~370 wpm, still faster than reading (~250) and than speech
    # (~150), so the extra latency is invisible while streaming.
    #
    # What decided it was accuracy on safety content. Asked how much water to
    # drink hiking in heat, the 1.5B answered "1-2 litres per day" — low enough
    # to be dangerous. The 3B answered 2.5-3. For a search-and-rescue device
    # that is the whole argument; the 1.5B is faster at being wrong.
    command: >
      -hf unsloth/Qwen3-4B-Instruct-2507-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      -c 8192
      -t 2
      --parallel 1
      --jinja
    deploy:
      resources:
        limits:
          # Raised from 1500m after the host went 4 GB -> 8 GB. Headroom here
          # is not about the weights (a 1.5B Q4_K_M is ~1 GB) but the KV cache,
          # which doubled with the context bump.
          #
          # 4600m for Qwen3-4B-Instruct-2507. Measured on this box, eight
          # questions, idle:
          #
          #     Qwen2.5-3B   mean  71 s
          #     Qwen3-4B     mean 129 s      ~1.8x slower
          #
          # Adopted with the speed known and accepted. The voice is the reason:
          # "SQLite. One file. No server. No config. Just works." against a
          # paragraph of hedging, and it picks up threads the 3B dropped.
          #
          # (An earlier note here said 3.6x. That came from a 35.8s baseline
          # taken while the page cache happened to be warm — precise-looking
          # and unrepresentative. 71s is the idle figure.)
          #
          # Two things to watch. It fits at 4.07 of 4.49 GB, so this cap has
          # little slack; check `free -m` before growing anything else. And it
          # confabulates specifics more fluently than the 3B did — it invented
          # a time a cable "gave in at 14:47" — which persona_marina.py now has
          # an explicit rule against.
          #
          # THE WEB UI USES THIS MODEL TOO. Telegram defaults to the hosted
          # agent, so the slowdown lands mostly on the page.
          memory: 4600m

  # Embeddings, for meaning-based vault search. Lexical retrieval cannot match
  # "how do i stop someone bleeding out" to a note titled Bleeding: there is no
  # shared word to stem or alias. That is the exact query this device exists
  # for, so the gap matters more here than the feature list suggests.
  #
  # A separate container rather than a second job for the chat model: llama is
  # loaded with a generative model and `-t 2` on a two-core box, and asking it
  # to embed would either evict the weights or contend for both cores mid-reply.
  #
  # 137M parameters against the chat model's 3B — embedding is a much smaller
  # problem than generation, and this one is small enough that the whole vault
  # can be embedded once and then queried in single-digit milliseconds.
  embed:
    image: ghcr.io/ggml-org/llama.cpp:server
    container_name: orb-embed
    restart: unless-stopped
    volumes:
      # /root/.cache/huggingface, NOT /root/.cache/llama.cpp. The volume was
      # mounted at the latter and llama.cpp caches to the former, so it held
      # nothing and every container recreate re-downloaded 1.8 GB into the
      # writable layer — where it was then thrown away with the container.
      - models:/root/.cache/huggingface
    # --pooling mean is required: BERT-family embedding models have no
    # last-token semantics to pool from, and the default returns nonsense
    # vectors that still look like valid floats.
    command: >
      -hf nomic-ai/nomic-embed-text-v1.5-GGUF:Q4_K_M
      --host 0.0.0.0
      --port 8080
      --embedding
      --pooling mean
      -c 2048
      -t 1
    deploy:
      resources:
        limits:
          # -t 1 deliberately: this must never take both cores away from a
          # reply in progress. Embedding the vault is a background job that can
          # afford to be slow; generation cannot.
          memory: 400m

  # Lemonade, on trial alongside llama rather than instead of it.
  #
  # It serves chat, embeddings, speech and images from one process with an
  # OpenAI-compatible API, which means it could in principle replace four of
  # the containers here. Whether it SHOULD is a question about tokens per
  # second and answer quality on this hardware, and that is measurable — so it
  # runs on its own port as a second agent and gets compared, rather than being
  # adopted or dismissed on argument.
  #
  # Deliberately not published to the host: the router reaches it by service
  # name like everything else, and nothing about a trial should widen what this
  # box exposes.
  lemonade:
    image: ghcr.io/lemonade-sdk/lemonade-server:latest
    container_name: orb-lemonade
    # MEASURED AND NOT ADOPTED, on this hardware. Kept behind a profile so a
    # plain `docker compose up -d` never starts it; bring it back with
    # `docker compose --profile trial up -d lemonade`.
    #
    # Uncontended, same prompt, 200 tokens, three runs each:
    #     llama.cpp  CPU        Qwen2.5-3B     8.37 tok/s
    #     lemonade   Vulkan     Llama-3.2-3B   7.03 tok/s
    #
    # 16% slower WITH the iGPU than llama.cpp without it, which sounds wrong
    # until you notice two things. Lemonade's chat engine IS llama.cpp — the
    # load response says recipe: llamacpp — so there was never a faster core to
    # find. And the accelerator it auto-selected, the HD 520, has no memory of
    # its own: it shares the same DDR4-2133 bus that is already the binding
    # constraint, so Vulkan adds marshalling overhead and buys no bandwidth.
    #
    # Its real advantages are unmeasurable in tok/s and still real: pulling a
    # new 3B by name took 91 seconds against editing this file and rebuilding,
    # a 69-model catalogue, and chat/vision/image/speech/embeddings in one
    # process. On a machine with a discrete GPU those would be joined by an
    # actual speed win. On this one they are not.
    #
    # Note before ever publishing its port: it serves /internal/mcp/*
    # process-launch endpoints unauthenticated unless LEMONADE_API_KEY is set.
    profiles: ["trial"]
    restart: unless-stopped
    volumes:
      - lemonade-cache:/opt/lemonade/.cache/huggingface
      - lemonade-llama:/opt/lemonade/llama
      - lemonade-data:/opt/lemonade/.cache/lemonade
      - lemonade-config:/opt/lemonade/.config/lemonade
    deploy:
      resources:
        limits:
          # Comparable to llama's 3500m so the comparison is about the software
          # rather than about which one was given more room.
          memory: 3400m

  # Runs code the model wrote, so its mistakes are caught by a traceback rather
  # than by the user. Verification is the single largest improvement available
  # to code help on this box: a smaller model that can run its own output and
  # read the error beats a larger one answering blind.
  #
  # The isolation is here, not in the Python. Every limit below is independent,
  # because the thing being executed is written by a 3B and must be assumed
  # wrong in ways nobody predicted:
  #
  #   sandbox_net is internal   - no route off the bridge. Nothing it runs can
  #                               reach the internet, the vault, the keys, the
  #                               LAN, or any other container except the router.
  #   read_only                 - the root filesystem is immutable
  #   tmpfs /tmp                - the only writable space, capped, gone on exit
  #   no volumes                - the vault and the API keys are not mounted
  #   cap_drop ALL              - no capabilities at all
  #   no-new-privileges         - setuid binaries cannot escalate
  #   pids_limit                - a fork bomb hits a wall
  #
  # This is not a defence against a determined attacker who already has code
  # execution. It is a defence against an infinite loop, a filled disk, or an
  # import that phones home, which is what actually happens.
  sandbox:
    build:
      context: .
      dockerfile: Dockerfile.sandbox
    image: nova-sandbox:latest
    container_name: orb-sandbox
    restart: unless-stopped
    networks:
      - sandbox_net
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    deploy:
      resources:
        limits:
          memory: 256m
          # A fork bomb is the most likely thing a confused model writes by
          # accident. Declared here rather than as pids_limit, which compose
          # refuses to accept alongside a deploy.resources block.
          pids: 96

  # Web search. The offline Wikipedia is a snapshot and cannot know anything
  # that happened after it was made — asked about a model released last month it
  # is not wrong, it is silent. This is the path for everything the archive
  # cannot contain.
  #
  # SearXNG rather than a search API: no key, no account, no quota, and no
  # single provider that can retire an endpoint underneath us. It aggregates
  # engines that answer without credentials.
  #
  # Set NOVA_WEB=0 to turn the whole capability off. Everything already in the
  # vault keeps working — this only ever ADDS sources.
  searxng:
    image: searxng/searxng:latest
    container_name: orb-searxng
    restart: unless-stopped
    volumes:
      - ./searxng:/etc/searxng:rw
    environment:
      - SEARXNG_BASE_URL=http://searxng:8080/
      # Generated at deploy time rather than committed. SearXNG refuses to
      # start on the default value, which is the correct behaviour.
      - SEARXNG_SECRET=${SEARXNG_SECRET:-change-me-at-deploy}
    deploy:
      resources:
        limits:
          memory: 320m

  piper:
    build:
      context: .
      dockerfile: Dockerfile.piper
    image: orb-piper:amy
    container_name: orb-piper
    restart: unless-stopped
    environment:
      # Settled voice. Overriding the env here avoids a rebuild, and means only
      # this one model is ever loaded unless another is auditioned explicitly.
      - VOICE_MODEL=/models/en_US-lessac-high.onnx
    deploy:
      resources:
        limits:
          # piper leaks: 186 MB fresh -> 266 MB after five syntheses -> 363 MB
          # over a session, and never releases. 640m gives plenty of headroom
          # so a restart is rare, while still capping it — uncapped, a leaking
          # process eventually starves llama of the page cache it mmaps the
          # model into, which is what made generation erratic before.
          memory: 640m

  # Agent router. Sits in front of llama on the chat endpoint and sends the
  # request to whichever backend the page asked for. With no keys installed at
  # all it is a pass-through to the local model, so the stack behaves exactly
  # as it did before this container existed.
  #
  # Every backend offered here is free — no card, no metered billing. Keys go
  # in ./keys/<agent>.key, one per file, mounted read-only; an agent with no
  # key file is simply never offered.
  #
  # Model IDs are env vars rather than code because hosted catalogues churn:
  # providers retire and rename models regularly, and that should be a restart,
  # not a rebuild. A wrong ID surfaces on /agents as last_error.
  remote:
    networks:
      - default
      - sandbox_net
    build:
      context: .
      dockerfile: Dockerfile.remote
    image: orb-remote:latest
    container_name: orb-remote
    restart: unless-stopped
    environment:
      # llama-3.3-70b-versatile was retired by Groq between 2026-08-17 and
      # 08-18 and started 404ing mid-use — the hard-fail logic withdrew the
      # agent automatically and /agents named the cause. Replaced with the
      # largest thing they now serve; measured 253ms on this question, which is
      # faster than the model it replaces despite being bigger.
      - GROQ_MODEL=openai/gpt-oss-120b
      # OpenRouter rotates its :free models out without warning, so expect this
      # one to 404 eventually. The router surfaces that on /agents as
      # last_error; pick a replacement from openrouter.ai/models filtered to
      # free pricing. The ":free" suffix is what makes it cost nothing.
      - OPENROUTER_MODEL=deepseek/deepseek-r1:free
      # Deliberately NOT llama-3.3-70b: `fast` already runs that, and two
      # agents on the same weights is a picker with a redundant entry. DeepSeek
      # V4 Flash is a genuinely different model, and NVIDIA's catalogue is the
      # widest of the four if it ever needs swapping again.
      - NVIDIA_MODEL=deepseek-ai/deepseek-v4-flash-0731
      # gemini-2.5-flash is retired for new accounts — it lists in the
      # catalogue but 404s with "no longer available to new users".
      # 3.x models reason before answering, so GEMINI_MAX_TOKENS is separate
      # and larger: thinking is billed against it but never shown.
      # Measured 2026-08-17, three calls each: 3.5-flash and 3.1-flash-lite
      # both 3/3, 3.7-flash 2/3, gemini-flash-latest only 1/3 (the rest 503
      # "experiencing high demand"). 3.5-flash is the strongest of the ones
      # that actually answer reliably, which matters more here than a newer
      # version number — a field device that intermittently drops to the 1.5B
      # is worse than a slightly older model that always responds.
      - GEMINI_MODEL=gemini-3.5-flash
      - GEMINI_MAX_TOKENS=2000
      # Free tiers ration tokens-per-minute far more tightly than requests,
      # so history depth is the setting that decides whether you get rate
      # limited mid-conversation.
      - REMOTE_HISTORY_TURNS=6
      # Raised from 700: a full first-aid procedure was being cut off mid-step.
      # Output is free on these tiers and arrives in seconds, so there is
      # nothing gained by rationing it — and long replies are fine to read on
      # a wrist. This overrides whatever the page asks for.
      - REMOTE_MAX_TOKENS=1200
      # Past this, fall back to local rather than leave the user watching a
      # dead orb. Hosted 70Bs answer in seconds; 60s means something is wrong.
      - REMOTE_TIMEOUT=60
      # GeoNames GB: 62k populated places and named high ground, 2.5 MB.
      # Turns a fix into words offline, which a street-address geocoder cannot
      # do without either a network round trip or a PostGIS instance.
      - PLACES_FILE=/data/places.json
      # Street addresses via OpenStreetMap's Nominatim, when there is signal.
      # Purely additive: the offline place name is computed first and returned
      # regardless, so this can never delay or block an answer.
      #
      # It does send coordinates to a third party. Set GEOCODE_ONLINE=0 to turn
      # that off entirely and stay on offline place names only — everything
      # already resolved stays cached and keeps working.
      - GEOCODE_ONLINE=1
      - GEOCODE_TIMEOUT=4
      # Nominatim's usage policy requires an identifying User-Agent and no more
      # than one request a second. Both are enforced in the router rather than
      # trusted to the browser.
      - GEOCODE_UA=Nova/1.0 (self-hosted personal assistant)
      # The router names every exchange log by the time it happened, and it was
      # writing them in UTC while the bridge logged BST — an hour apart, which
      # made correlating "the bot answered at 18:25" with "172542-what-is-the-
      # weather.md" a small puzzle in the middle of a real diagnosis. Both
      # clocks local now.
      - TZ=${NOVA_TZ:-Europe/London}
    volumes:
      - ./logs:/logs
      - ./keys:/run/keys:ro
      - ./data:/data:ro
      # Writable: uploaded documents become notes here. Same directory the page
      # reads and Obsidian syncs, so an upload appears everywhere at once.
      - ./mem:/mem
    depends_on:
      - llama
    deploy:
      resources:
        limits:
          # Raised from 128m: the place list is held in memory so a lookup is
          # a bisect and a few hundred haversines rather than a file read.
          memory: 256m

  # Nova over Telegram: reachable when the page is not open, and able to speak
  # first when something breaks. Long polling, so nothing is published and
  # Tailscale Funnel stays off — which matters here because the WebDAV vault
  # below is served unauthenticated by request.
  #
  # Enrolment is one step: get a token from @BotFather, write it to
  # /opt/orb/keys/bridge/telegram.key (mode 600), then send the bot the code in
  # NOVA_TG_ENROL as your first message. That claims the bot, persists the chat
  # id to /logs/bridge-state.json, and burns the code.
  #
  # By code rather than by trusting whoever messages first. Trust-on-first-use
  # would be simpler and is wrong: between the token being installed and the
  # owner sending a message, anyone who knows the bot's name is the first, and
  # the failure is silent and permanent.
  #
  # Without a token it waits quietly; with a token and no enrolment it answers
  # nobody. Both are the safe failure.
  bridge:
    build:
      context: .
      dockerfile: Dockerfile.bridge
    image: nova-bridge:latest
    container_name: nova-bridge
    restart: unless-stopped
    environment:
      # Numeric chat ids, comma separated. Empty means nobody: a bot username
      # is discoverable and anyone may message it, so default-deny is the only
      # safe reading of an unset variable. An open bot would hand a stranger an
      # assistant with the whole personal vault attached.
      - NOVA_TG_ALLOW=${NOVA_TG_ALLOW:-}
      # One-time claim code. Single use — spent on first success and recorded
      # in bridge-state.json, so a leak afterwards is worth nothing. Unknown
      # senders are rate limited before it is checked, so it cannot be
      # brute forced at network speed.
      - NOVA_TG_ENROL=${NOVA_TG_ENROL:-nova-cedar-rowan-delta-umber-9346}
      - NOVA_TG_PER_MIN=12
      # Which brain answers a chat message. "fast" is gpt-oss-120b on a free
      # tier and is the reason Marina sounds like a person rather than a 3B
      # doing an impression of one.
      #
      # It sends the message, the conversation, any retrieved note and what she
      # remembers about him off the box. Set this to "local" to keep all of it
      # on the laptop — everything still works, it just sounds flatter.
      - NOVA_CHAT_AGENT=${NOVA_CHAT_AGENT:-fast}
      - NOVA_HEALTH_EVERY=300
      # Everything with a clock in it depends on this: the morning brief, every
      # reminder, and the date a brief was last sent. The container is UTC
      # without it, which is an hour out for half the year and looks fine.
      - TZ=${NOVA_TZ:-Europe/London}
      # Voice notes: 2 minutes in, and past ~700 characters a reply is text
      # only. Piper on two cores is not quick, and nobody wants a four-minute
      # voice note read at them.
      - NOVA_MAX_VOICE_S=120
      - NOVA_MAX_SPEAK_CHARS=700
    volumes:
      # Only the bridge's own key, in its own directory. Mounting ./keys here
      # would hand the Telegram relay every model provider key as well, and it
      # has no business with any of them.
      - ./keys/bridge:/run/keys:ro
      - ./logs:/logs
    depends_on:
      - remote
      - whisper
      - piper
    # No ports. No vault. No docker socket. It talks to /ask, to whisper and
    # piper for voice, and to Telegram — that is the entire blast radius if it
    # is ever compromised.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    deploy:
      resources:
        limits:
          # 256m rather than 128m since ffmpeg landed: a short Opus transcode
          # is small but not free, and being OOM-killed mid-voice-note would
          # look like the bridge randomly ignoring people.
          memory: 256m

  # Real WebDAV over the notes vault, so Obsidian can sync it from a phone and
  # a laptop. nginx's dav module does PUT and DELETE but NOT PROPFIND, which is
  # what a WebDAV client needs to list a directory — the existing /mem/ endpoint
  # is enough for the Orb page and returns 405 to Obsidian.
  #
  # Credentials are generated on the server into ./webdav/password (mode 600)
  # and stored here only as a bcrypt hash.
  webdav:
    image: hacdias/webdav:latest
    container_name: orb-webdav
    restart: unless-stopped
    command: ["--config", "/config/config.yml"]
    volumes:
      # Mounted one level down, at /data/Orb rather than /data, so the vault
      # appears over WebDAV as /dav/Orb/ and not /dav/.
      #
      # This is to match Remotely Save, which uses the VAULT NAME as its remote
      # base directory when the "remote base directory" box is left empty — the
      # empty field means "default", not "root". Its own connection test proved
      # it: probe files landed at /dav/Orb/rs-test-folder-*/ while all 309 notes
      # sat at /dav/, so the plugin connected successfully and then synced an
      # empty directory.
      #
      # Doing it here rather than by moving the notes keeps /opt/orb/mem as the
      # single vault path that everything else already uses — the router's
      # search, /ingest uploads, the page's fact store and the nightly backup
      # all stay pointed at exactly the same directory they were before.
      - ./mem:/data/Orb
      - ./webdav:/config:ro
    deploy:
      resources:
        limits:
          memory: 96m

  # Offline full English Wikipedia (~50 GB, no images). Costs disk, not RAM —
  # kiwix-serve mmaps the archive, so a 50 GB dump is barely dearer in memory
  # than the 938 MB one it replaced. This is what lets a 1.5B model answer
  # factual questions it would otherwise invent answers to.
  kiwix:
    image: ghcr.io/kiwix/kiwix-serve:latest
    container_name: orb-kiwix
    restart: unless-stopped
    volumes:
      - ./zim:/data:ro
    # The image's ENTRYPOINT already passes --port=8080; repeating it here made
    # the arg parser reject everything. Threads capped at 2 to match the cores
    # this LXC has, which it shares with llama.
    #
    # -s enables full-text search ACROSS archives; without it a multi-ZIM
    # server only searches within one book at a time.
    #
    # The Wikipedia medical subset is deliberately absent — the full English
    # dump already contains it. These add what Wikipedia does not: clinical
    # depth (mdwiki) and practical field procedure (zimgit).
    command:
      - "-t"
      - "2"
      - "-m"
      - "-s"
      - "8"
      # zimgit-medicine and zimgit-knots were dropped: each is a SINGLE-article
      # bundle, so they never won a search against the real collections — every
      # test hit came from wikipedia_en_full or mdwiki-medicine — while each
      # open archive still cost memory the model needs for page cache.
      - "/data/wikipedia_en_full.zim"
      - "/data/mdwiki-medicine.zim"
    deploy:
      resources:
        limits:
          # Raised from 480m with the RAM upgrade. kiwix mmaps a 50 GB archive,
          # so every extra megabyte is search-index page cache that stays
          # resident instead of being re-read from disk — this is the cheapest
          # real speed-up available to offline lookups.
          memory: 1024m

  web:
    image: nginx:alpine
    container_name: orb-web
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./index.html:/usr/share/nginx/html/index.html:ro
      - ./manifest.json:/usr/share/nginx/html/manifest.json:ro
      - ./apple-touch-icon.png:/usr/share/nginx/html/apple-touch-icon.png:ro
      - ./icon-192.png:/usr/share/nginx/html/icon-192.png:ro
      - ./icon-512.png:/usr/share/nginx/html/icon-512.png:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Self-hosted IBM Plex Mono, 45 KB for three weights. A webfont CDN would
      # be one more thing that has to work on a hillside; this does not.
      - ./fonts:/usr/share/nginx/html/fonts:ro
      # Character avatar, optional. Empty by default and the page falls back to
      # the orb, so a deployment with no artwork in it is not a broken one.
      - ./avatar:/usr/share/nginx/html/avatar:ro
      - ./mem:/var/lib/orb/mem          # writable: WebDAV memory store
    depends_on:
      - llama
      - piper
    deploy:
      resources:
        limits:
          memory: 64m

  # Server-side speech-to-text. No longer optional: it is the ONLY voice path
  # that works when the page is launched from the iOS home screen, because
  # webkitSpeechRecognition is broken in standalone mode there. Verified on the
  # device — dictation works in Safari, dies from the home-screen icon.
  whisper:
    build:
      context: .
      dockerfile: Dockerfile.whisper
    image: orb-whisper:base-en
    container_name: orb-whisper
    restart: unless-stopped
    deploy:
      resources:
        limits:
          # Raised from 320m with the move from tiny.en to base.en: the weights
          # go ~75 MB -> ~150 MB and the decode buffers grow with them. There is
          # room — the host sits around 2.4 GB of 5 GB used — and the alternative
          # was a transcriber that heard "grid reference" as "great reference",
          # which silently disables the position command that matches on it.
          memory: 500m

networks:
  default:
  # internal: true means no gateway to the outside is attached, so a container
  # on this network alone cannot reach anything off the host at all.
  sandbox_net:
    internal: true

volumes:
  models:
  # Lemonade keeps its model cache, backend binaries and config in named
  # volumes. Kept separate from the bind mounts so removing the trial is a
  # single `docker compose down -v lemonade` and leaves nothing behind.
  lemonade-cache:
  lemonade-llama:
  lemonade-data:
  lemonade-config:
