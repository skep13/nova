<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#050b1a">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-192.png">
<link rel="manifest" href="/manifest.json">
<title>Orb</title>
<style>
/* ============================================================
   Landscape is THE layout, not a variant. The phone is wrist
   mounted and never turns. Portrait exists only so the page is
   not broken if the sensor disagrees for a moment.
   Design target: 852 x 393, minus a notch on one short edge.
   ============================================================ */
/* IBM Plex Mono, self-hosted. A webfont CDN is one more thing that has to
   work on a hillside; 45 KB in the container does not. Used for every readout
   and label — a grid reference, a bearing and a model name are instrument
   values, and mono with tabular figures stops them reflowing as they change.
   Prose deliberately stays in the system face: the best-legible text this
   phone can render is what a first-aid procedure should be set in. */
@font-face{font-family:'Plex Mono';src:url('/fonts/plex-mono-400.woff2') format('woff2');
  font-weight:400;font-style:normal;font-display:swap}
@font-face{font-family:'Plex Mono';src:url('/fonts/plex-mono-500.woff2') format('woff2');
  font-weight:500;font-style:normal;font-display:swap}
@font-face{font-family:'Plex Mono';src:url('/fonts/plex-mono-600.woff2') format('woff2');
  font-weight:600;font-style:normal;font-display:swap}

:root{
  /* Near-black rather than black: an unlit instrument reads as dead, and the
     panel is OLED so this still costs almost nothing. */
  --bg:#03070f;
  --ink:#e8f1ff;
  --ink-dim:#8ba7cd;
  --ink-faint:#7e9cc4;
  --cyan:#5cc8ff;
  --edge:rgba(130,190,255,.13);
  --edge-lit:rgba(120,200,255,.36);
  --panel:linear-gradient(180deg,rgba(150,200,255,.115),rgba(120,170,255,.055));
  --mono:'Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
  --orb:min(34vw, 76vh, 330px);
  --rail:56px;
}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{
  background:var(--bg);
  color:var(--ink);
  font:400 16px/1.5 -apple-system,BlinkMacSystemFont,"SF Pro Text",Segoe UI,system-ui,sans-serif;
  overflow:hidden;
  overscroll-behavior:none;
  -webkit-user-select:none;user-select:none;
}

/* ---------- ambient background ---------- */
.bokeh{position:fixed;inset:-20%;z-index:0;pointer-events:none;filter:blur(70px);opacity:.42}
.bokeh i{position:absolute;border-radius:50%;display:block}
.bokeh i:nth-child(1){width:46vmax;height:46vmax;left:-8%;top:-12%;background:radial-gradient(circle,#1b4d94,transparent 70%)}
.bokeh i:nth-child(2){width:38vmax;height:38vmax;right:-10%;top:18%;background:radial-gradient(circle,#0f3572,transparent 70%)}
.bokeh i:nth-child(3){width:52vmax;height:52vmax;left:12%;bottom:-24%;background:radial-gradient(circle,#123f83,transparent 70%)}

/* Grain. A flat dark rectangle reads as an absence; a faint irregular texture
   reads as a surface with a light on it. Generated inline so it costs no
   request and works offline, and kept low enough to be felt not seen. */
.grain{
  position:fixed;inset:0;z-index:3;pointer-events:none;opacity:.05;
  mix-blend-mode:overlay;
  background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='140' height='140'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='3'/></filter><rect width='140' height='140' filter='url(%23n)' opacity='.5'/></svg>");
}
/* Vignette: pulls the eye to the middle and stops the edges of an OLED panel
   looking like the edges of a black rectangle. */
.vig{
  position:fixed;inset:0;z-index:2;pointer-events:none;
  background:radial-gradient(120% 90% at 50% 45%,transparent 45%,rgba(0,0,0,.55) 100%);
}

/* ---------- shell: orb | transcript | rail ---------- */
.app{
  position:relative;z-index:1;
  display:flex;flex-direction:row;
  height:100dvh;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}

/* the whole left pane is the mic target, not just the orb itself */
.left{
  flex:0 0 38%;
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;
  padding:6px 0;
  cursor:pointer;touch-action:manipulation;
}

.mid{
  flex:1 1 auto;min-width:0;min-height:0;
  display:flex;flex-direction:column;
}

.rail{
  position:relative;
  flex:0 0 auto;width:var(--rail);
  display:flex;flex-direction:column;
  align-items:center;justify-content:center;gap:11px;
  background:linear-gradient(180deg,rgba(120,180,255,.055),rgba(120,180,255,.012));
}
/* A hairline that fades at both ends reads as machined; one that runs edge to
   edge reads as a border someone forgot to style. */
.rail::before,.mid::after{
  content:'';position:absolute;top:6%;bottom:6%;width:1px;
  background:linear-gradient(180deg,transparent,var(--edge) 18%,var(--edge) 82%,transparent);
}
.rail::before{left:0}
.mid::after{right:0}
.mid{position:relative}

/* ---------- orb ---------- */
.orb-wrap{
  position:relative;
  width:var(--orb);height:var(--orb);
  transform:scale(calc(1 + var(--amp,0) * .05));
  transition:transform .1s ease-out;
}
.halo{
  position:absolute;inset:-26%;border-radius:50%;
  background:radial-gradient(circle,
    rgba(79,195,255,calc(.20 + var(--amp,0)*.32)) 0%,
    rgba(40,110,220,.13) 42%, transparent 72%);
  filter:blur(14px);
}
.rings{
  position:absolute;inset:0;border-radius:50%;
  background:radial-gradient(circle at 50% 50%,
    #0a1830 0%,  #0a1830 24%,
    #dff2ff 26.5%, #ffffff 30%, #c6e7ff 34.5%,
    #0b1c3a 37.5%, #091830 46%,
    #b6e2ff 49.5%, #ffffff 55%, #d2eeff 60.5%,
    #2159a4 64%, #17418a 70%,
    #123671 74%, #17458a 84%,
    #0c2450 90.5%, rgba(9,22,48,0) 100%);
}
.bloom{
  position:absolute;inset:0;border-radius:50%;
  background:inherit;
  filter:blur(11px) saturate(1.25);
  opacity:calc(.72 + var(--amp,0)*.28);
  mix-blend-mode:screen;pointer-events:none;
}
.facets{
  position:absolute;inset:0;border-radius:50%;
  background:repeating-conic-gradient(from 0deg,
    rgba(190,225,255,.13) 0deg 11deg,
    rgba(2,10,26,.26) 11deg 45deg);
  -webkit-mask:radial-gradient(circle,transparent 63%,#000 69%,#000 91%,transparent 99%);
          mask:radial-gradient(circle,transparent 63%,#000 69%,#000 91%,transparent 99%);
  mix-blend-mode:overlay;
  animation:spin 48s linear infinite;pointer-events:none;
}
.pip{
  position:absolute;left:56%;top:60%;width:13%;height:13%;
  border-radius:50%;
  background:radial-gradient(circle at 38% 34%,#fff,#d7efff 55%,#8fd0ff 100%);
  box-shadow:0 0 12px rgba(180,230,255,.9),0 0 30px rgba(79,195,255,.55);
  transform:translate(-50%,-50%);pointer-events:none;
}
.ripple{
  position:absolute;inset:0;border-radius:50%;
  border:1px solid rgba(150,215,255,.5);
  opacity:0;pointer-events:none;
}
body.listening .ripple{animation:ripple 2.4s cubic-bezier(.2,.7,.3,1) infinite}
body.listening .ripple:nth-of-type(2){animation-delay:.8s}
body.listening .ripple:nth-of-type(3){animation-delay:1.6s}

@keyframes ripple{0%{transform:scale(1);opacity:.6}100%{transform:scale(1.75);opacity:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes breathe{0%,100%{transform:scale(1)}50%{transform:scale(1.022)}}
@keyframes think{
  0%,100%{filter:blur(11px) saturate(1.25) hue-rotate(0deg)}
  50%{filter:blur(15px) saturate(1.6) hue-rotate(-14deg)}
}
body.idle .orb-wrap{animation:breathe 6.5s ease-in-out infinite}
body.thinking .facets{animation-duration:7s}
body.thinking .bloom{animation:think 1.8s ease-in-out infinite}

/* ---------- status ---------- */
.status{
  text-align:center;
  font-family:var(--mono);font-weight:500;
  font-size:11px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--ink-faint);
  min-height:18px;padding:13px 12px 0;
  max-width:100%;
}

/* ---------- glanceable state ----------
   Sits under the orb in space the left pane already had spare. Deliberately
   quiet: it must be readable at a glance without competing with the orb, which
   is the thing you aim at. */
.glance{
  display:flex;gap:8px;align-items:center;justify-content:center;
  flex-wrap:wrap;padding:10px 8px 0;max-width:100%;
}
.chip{
  font-family:var(--mono);font-weight:500;
  font-size:10px;letter-spacing:.1em;text-transform:uppercase;
  font-variant-numeric:tabular-nums;
  color:var(--ink-dim);
  background:linear-gradient(180deg,rgba(150,200,255,.09),rgba(120,170,255,.03));
  border:1px solid var(--edge);border-radius:5px;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  padding:5px 9px;
  cursor:pointer;touch-action:manipulation;
  white-space:nowrap;max-width:100%;overflow:hidden;text-overflow:ellipsis;
  transition:color .18s,border-color .18s,background .18s,box-shadow .18s;
}
/* A lit pip rather than a filled pill: reads as a status lamp, and survives
   being glanced at from an angle better than a colour change alone. */
.chip::before{
  content:'';display:inline-block;vertical-align:middle;
  width:4px;height:4px;border-radius:50%;margin-right:6px;
  background:var(--ink-faint);
  box-shadow:none;transition:background .18s,box-shadow .18s;
}
.chip:active{background:rgba(79,195,255,.18)}
/* Lit only when a REMOTE model is answering — local is the default and the
   quiet state, matching the rail button. */
.chip.remote{
  color:#d3ecff;border-color:var(--edge-lit);
  background:linear-gradient(180deg,rgba(92,200,255,.20),rgba(60,150,240,.08));
  box-shadow:0 1px 0 rgba(255,255,255,.10) inset,0 0 14px rgba(92,200,255,.18);
}
.chip.remote::before{background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
.chip.geo.fixing::before{background:var(--cyan);box-shadow:0 0 7px var(--cyan)}
/* A stale fix is worse than no fix if you cannot tell it is stale. */
.chip.geo.stale{opacity:.55}
.chip.geo.fixing{color:var(--cyan)}
body.listening .status{
  color:var(--cyan);text-transform:none;letter-spacing:.01em;font-size:14.5px;
}

/* ---------- transcript ---------- */
.log{
  flex:1 1 auto;min-height:0;
  overflow-y:auto;-webkit-overflow-scrolling:touch;
  padding:14px 18px 12px;
  display:flex;flex-direction:column;gap:11px;
  mask:linear-gradient(to bottom,transparent 0,#000 14px);
  scrollbar-width:none;
  -webkit-user-select:text;user-select:text;
}
.log::-webkit-scrollbar{width:0}
.msg{
  max-width:90%;padding:11px 14px;
  font-size:17px;line-height:1.52;
  white-space:pre-wrap;overflow-wrap:break-word;
  animation:rise .22s cubic-bezier(.2,.7,.3,1);
}
@keyframes rise{from{opacity:0;transform:translateY(6px) scale(.995)}}
.msg.user{
  align-self:flex-end;
  background:linear-gradient(180deg,#1f63c4,#154a99);color:#fff;
  border:1px solid rgba(150,205,255,.30);
  border-radius:13px 13px 4px 13px;
  box-shadow:0 1px 0 rgba(255,255,255,.16) inset,0 8px 20px rgba(6,24,58,.55);
}
.msg.bot{
  align-self:flex-start;
  background:var(--panel);
  border:1px solid var(--edge);
  border-radius:13px 13px 13px 4px;
  /* A top-edge highlight and a cast shadow are what separate a panel sitting
     ON the ground from a rectangle painted INTO it. */
  box-shadow:0 1px 0 rgba(255,255,255,.07) inset,0 8px 22px rgba(0,0,0,.42);
  -webkit-backdrop-filter:blur(7px);backdrop-filter:blur(7px);
}
.msg.bot.pending::after{
  content:'';display:inline-block;width:7px;height:7px;margin-left:3px;
  border-radius:50%;background:var(--cyan);
  animation:blink 1s steps(2,end) infinite;
}
@keyframes blink{50%{opacity:0}}
.msg.err{background:rgba(190,60,70,.16);border-color:rgba(255,120,130,.3);color:#ffc9ce}

/* source trace: which article the answer was grounded in, so a wrong answer
   is diagnosable at a glance instead of just looking confident */
.trace{
  align-self:flex-start;
  font-size:13px;color:var(--ink-dim);
  padding:1px 6px;margin:-4px 0 -2px;
  opacity:.9;
}

/* ---------- composer: hidden until asked for ----------
   A keyboard covers most of a landscape phone, so the input is not worth
   permanent screen space on a device driven by voice. */
.composer{
  display:none;align-items:center;gap:8px;
  flex:0 0 auto;
  padding:7px 12px;
  border-top:1px solid var(--edge);
  background:rgba(5,12,28,.72);
  backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);
}
.composer.show{display:flex}
.upload{
  flex:0 0 auto;width:36px;height:36px;border-radius:10px;
  border:1px solid var(--edge);background:rgba(150,200,255,.07);
  color:#cfe4ff;display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset;
  transition:background .15s,border-color .15s;
}
.upload:active{background:rgba(92,200,255,.2)}
.upload svg{width:17px;height:17px;fill:currentColor}
.upload.busy{color:var(--cyan);border-color:var(--edge-lit)}

.composer input[type=text],.composer input:not([type]){
  flex:1;min-width:0;
  background:rgba(255,255,255,.06);
  border:1px solid var(--edge);border-radius:19px;
  padding:9px 14px;color:var(--ink);
  font-size:16px;  /* under 16px and iOS zooms the page on focus */
  outline:none;
}
.composer input::placeholder{color:#5a7aa3}
.composer input:focus{border-color:rgba(79,195,255,.45)}

/* ---------- rail controls ---------- */
.btn{
  /* 44px is Apple's minimum comfortable target and this is used at arm's
     length, in weather, possibly through a glove. Six of these plus the gaps
     still clear a 393px landscape viewport with room to spare. */
  flex:0 0 auto;width:44px;height:44px;border-radius:50%;
  border:1px solid var(--edge);background:rgba(255,255,255,.06);
  color:#cfe4ff;display:grid;place-items:center;
  cursor:pointer;touch-action:manipulation;
  box-shadow:0 1px 0 rgba(255,255,255,.055) inset;
  transition:background .18s,border-color .18s,color .18s,box-shadow .18s;
}
.btn:active{background:rgba(79,195,255,.22)}
.btn.on{
  background:linear-gradient(180deg,rgba(92,200,255,.24),rgba(60,150,240,.10));
  border-color:var(--edge-lit);color:#dcf1ff;
  box-shadow:0 1px 0 rgba(255,255,255,.12) inset,0 0 16px rgba(92,200,255,.22);
}
.btn.hide{display:none}
.btn svg{width:20px;height:20px;fill:currentColor}

/* muted speaker: a slash, so the state reads at a glance rather than relying
   on a subtle fill change */
.btn.muted{position:relative;color:var(--ink-dim)}
.btn.muted::after{
  content:'';position:absolute;
  width:23px;height:2px;border-radius:1px;
  background:currentColor;transform:rotate(-45deg);
}

.net{
  flex:0 0 auto;width:7px;height:7px;border-radius:50%;
  background:var(--cyan);opacity:.45;
  transition:background .3s,opacity .3s;
}
html.offline .net{background:#ff5d68;opacity:1}

/* ---------- idle dim ----------
   Wake Lock pins the screen on; on a wrist that would run the battery down
   for nothing. The panel is OLED, so black is a real power saving. */
.dim{
  position:fixed;inset:0;z-index:20;
  background:#000;opacity:0;pointer-events:none;
  transition:opacity 1.1s ease;
}
html.dimmed .dim{opacity:.92;pointer-events:auto}

/* ---------- portrait: fallback only ---------- */
@media (orientation:portrait){
  :root{--orb:min(62vw, 38vh, 290px)}
  .app{flex-direction:column}
  .left{flex:0 0 auto;padding:20px 0 6px}
  .rail{
    width:auto;flex-direction:row;
    border-left:0;border-top:1px solid var(--edge);
    padding:8px 12px calc(8px + env(safe-area-inset-bottom));
    gap:10px;
  }
  .msg{font-size:16px;max-width:86%}
}

@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body class="idle">

<div class="bokeh"><i></i><i></i><i></i></div>

<div class="vig"></div>
<div class="grain"></div>

<div class="app">
  <div class="left" id="micZone" role="button" tabindex="0" aria-label="Tap to speak">
    <div class="orb-wrap" id="orb">
      <div class="halo"></div>
      <div class="ripple"></div><div class="ripple"></div><div class="ripple"></div>
      <div class="rings"><div class="bloom"></div></div>
      <div class="facets"></div>
      <div class="pip"></div>
    </div>
    <div class="status" id="status">tap to speak</div>

    <!-- Glanceable state. Both of these were previously only answerable by
         tapping something and waiting: which brain is replying, and where you
         are. On a wrist the whole value is not having to interact to find out.
         Stopping propagation matters — the entire left pane is the mic. -->
    <div class="glance">
      <button class="chip" id="agentChip" aria-label="Model in use, tap to change">local</button>
      <button class="chip geo" id="geoChip" aria-label="Position, tap for a fix">position</button>
    </div>
  </div>

  <div class="mid">
    <div class="log" id="log"></div>
    <div class="composer" id="composer">
      <!-- Lives with the keyboard rather than on the rail: uploading is a
           deliberate, two-handed act, not something to do mid-stride. -->
      <button class="upload" id="upBtn" aria-label="Add a document to the vault">
        <svg viewBox="0 0 24 24"><path d="M12 3l5 5h-3v6h-4V8H7l5-5zM5 18h14v2H5v-2z"/></svg>
      </button>
      <input type="file" id="upFile" accept=".docx,.md,.markdown,.txt,.text,.csv,.json,.log,.htm,.html" hidden>
      <input id="input" placeholder="Message" autocomplete="off" autocapitalize="sentences" enterkeyhint="send">
    </div>
  </div>

  <div class="rail">
    <button class="btn" id="kbBtn" aria-label="Type instead">
      <svg viewBox="0 0 24 24"><path d="M20 5H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zM7 9h2v2H7V9zm0 4h2v2H7v-2zm-3-4h2v2H4V9zm0 4h2v2H4v-2zm12 4H8v-2h8v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2zm4 8h-2v-2h2v2zm0-4h-2v-2h2v2zm0-4h-2V9h2v2z"/></svg>
    </button>
    <button class="btn on" id="wikiBtn" aria-label="Use offline Wikipedia">
      <svg viewBox="0 0 24 24"><path d="M4 3.5A2.5 2.5 0 0 1 6.5 1H19a1 1 0 0 1 1 1v16a1 1 0 0 1-1 1H6.5a1.5 1.5 0 0 0 0 3H19a1 1 0 1 1 0 2H6.5A3.5 3.5 0 0 1 3 20.5v-17zM7 5v2h9V5H7zm0 4v2h9V9H7z"/></svg>
    </button>
    <button class="btn on" id="ttsBtn" aria-label="Toggle spoken replies">
      <svg viewBox="0 0 24 24"><path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3a4.5 4.5 0 0 0-2.5-4.03v8.05A4.47 4.47 0 0 0 16.5 12zM14 3.23v2.06a7 7 0 0 1 0 13.42v2.06a9 9 0 0 0 0-17.54z"/></svg>
    </button>
    <!-- Cycles through the backends that actually have a key. Muted on local,
         lit on anything remote, so the offline state is the quiet one. -->
    <button class="btn muted" id="agentBtn" aria-label="Model: local">
      <svg viewBox="0 0 24 24"><path d="M7 7h10v10H7V7zm2 2v6h6V9H9zM11 2h2v3h-2V2zm0 17h2v3h-2v-3zM2 11h3v2H2v-2zm17 0h3v2h-3v-2zM6 2h2v3H6V2zm10 0h2v3h-2V2zM6 19h2v3H6v-3zm10 0h2v3h-2v-3zM2 6h3v2H2V6zm0 10h3v2H2v-2zM19 6h3v2h-3V6zm0 10h3v2h-3v-2z"/></svg>
    </button>
    <!-- Tidies the screen without touching what the model remembers. -->
    <button class="btn" id="clearBtn" aria-label="Clear screen">
      <svg viewBox="0 0 24 24"><path d="M15.1 3.5 20.5 8.9a2 2 0 0 1 0 2.8l-7.4 7.4a2 2 0 0 1-1.4.6H8.3l-2.1 2.1-1.4-1.4 2.1-2.1v-3.4a2 2 0 0 1 .6-1.4l7.4-7.4a2 2 0 0 1 2.8 0zM13.7 6.3 8.8 11.2v3.6h3.6l4.9-4.9-3.6-3.6zM3 20h5v2H3v-2z"/></svg>
    </button>
    <!-- Destructive: drops the conversation entirely. Arms on first tap. -->
    <button class="btn" id="newBtn" aria-label="New chat">
      <svg viewBox="0 0 24 24"><path d="M20 2H4a2 2 0 0 0-2 2v18l4-4h14a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2zm-7 11h-2v-2H9V9h2V7h2v2h2v2h-2v2z"/></svg>
    </button>
    <span class="net" id="net" title="model connection"></span>
  </div>
</div>

<div class="dim" id="dim"></div>

<script>
(() => {
'use strict';

const CHAT_API = '/v1/chat/completions';
const STT_API  = '/stt';
const TTS_API  = '/tts';

const orb     = document.getElementById('orb');
const micZone = document.getElementById('micZone');
const log     = document.getElementById('log');
const input   = document.getElementById('input');
const composer= document.getElementById('composer');
const kbBtn   = document.getElementById('kbBtn');
const wikiBtn = document.getElementById('wikiBtn');
const agentBtn = document.getElementById('agentBtn');
const agentChip = document.getElementById('agentChip');
const geoChip = document.getElementById('geoChip');
const clearBtn = document.getElementById('clearBtn');
const newBtn = document.getElementById('newBtn');
const ttsBtn  = document.getElementById('ttsBtn');
const dimEl   = document.getElementById('dim');
const statusEl= document.getElementById('status');

// Timbre is Piper's job; attitude is the prompt's. The character is a precise
// analytical machine with a superiority complex — dry, teasing, faintly
// exasperated, but it always actually answers. Answer-first is load-bearing:
// at 13 tok/s, snark that delays the answer is just latency.
// A 1.5B follows examples far better than adjectives. Describing the tone got
// flat factual answers; showing it is what actually moves the output.
// Competent colleague, not a butler and not a nag. No honorifics, no
// deference, no apologising — and equally no lecturing the user about their
// habits. Dry, brief, self-assured.
const PERSONA =
  'You are Fairy, an advanced AI assistant: precise, analytical and self-assured. '
+ 'You speak to the user as an equal and a colleague — never deferential, never servile. '
+ 'Never call anyone "sir", "master" or "boss", never apologise unprompted, and never offer '
+ 'to serve. You have dry understated wit and you are direct. '
+ 'Lead with the answer, keep it brief, and add a dry aside only when it genuinely fits.';

// Examples written INSIDE the system message did nothing — a 1.5B ignores
// them. Supplied as real turns it continues the pattern, which is the
// difference between describing a voice and demonstrating one. These sit in
// the cached prefix, so they cost tokens once rather than every turn.
// name:'example' marks these as droppable. They exist to teach a 1.5B a tone;
// a larger model does not need them, and dropping them saves ~200 tokens on
// every billed request.
const FEWSHOT = [
  // A greeting has to be shown, not described. Both models default to
  // "How can I assist you today?" on a bare hello — the exact servile register
  // the system prompt forbids in words and loses to anyway. The 3B is worse at
  // this than the 1.5B was: a bigger model has a stronger stock-assistant
  // prior, so the instruction alone is outvoted.
  { role:'user',      name:'example', content:'hello there' },
  { role:'assistant', name:'example', content:'Hello. What are we looking at?' },
  { role:'user',      name:'example', content:'what is the capital of France?' },
  { role:'assistant', name:'example', content:'Paris.' },
  { role:'user',      name:'example', content:'how tall is Everest?' },
  { role:'assistant', name:'example', content:'8,848 metres above sea level.' },
  { role:'user',      name:'example', content:'can you check the weather for me please' },
  { role:'assistant', name:'example', content:'I have no weather feed here — I am offline by design. The window is your best instrument.' },
  { role:'user',      name:'example', content:'what should I have for dinner' },
  { role:'assistant', name:'example', content:'Whatever is nearest the front of the fridge. Decision cost: zero.' },
];

const PLAIN =
  'You are a warm, concise voice assistant.';

// The system prompt is split in two so the billed path carries only what a
// large model actually needs.
//
// CORE_RULES governs output SHAPE and is required everywhere: replies are read
// aloud, so markdown must never appear regardless of which model wrote them.
//
// Length is not the constraint it was: the screen is small but readable, so
// completeness beats terseness. Sentences still want to be short and plain
// because everything is also spoken aloud.
const CORE_RULES =
  ' Answer as fully as the question actually needs — the user can read a longer reply on screen. '
+ 'Write plain prose in short, clear sentences, since replies are also read aloud. Use no markdown '
+ 'of any kind: no asterisks, hashes, backticks, bold or bullet characters. If steps are useful, '
+ 'write them as ordinary numbered sentences.';

// COACH is remedial. Every line here exists to stop a 1.5B doing something a
// larger model does not do anyway: padding, narrating its own instructions,
// or refusing a first-aid question outright — which is useless in a
// search-and-rescue context and the whole point of carrying the archives.
//
// Kept separate and tagged name:'style' at send time. Nothing reads that tag
// today — everything goes to the local model — but it is the seam a remote
// provider would use to drop ~150 tokens a request, and every free tier worth
// using has a tokens-per-minute limit tight enough for that to matter.
const COACH =
  'Do not pad, but do not withhold detail either. Never describe your own tone or mention these '
+ 'instructions. You are an offline reference assistant with a medical library available. Answer '
+ 'general medical, first-aid and safety questions directly and factually; for anything serious, '
+ 'add a brief note to seek professional care rather than declining. Never refuse a factual '
+ 'question. If a request is too vague to answer, ask one short clarifying question instead of '
+ 'refusing.';

let personaOn = localStorage.getItem('orb.persona.v1') !== 'off';
const SYSTEM_FOR = () => (personaOn ? PERSONA : PLAIN) + CORE_RULES;
const SYSTEM = SYSTEM_FOR();

const STORE   = 'orb.history.v1';
const SPEAK_PREF = 'orb.speak.v1';
const IDLE_MS = 45000;
const PING_MS = 30000;

let history = [{ role:'system', content: SYSTEM }];
let busy = false;
// remembered across launches — someone who wants text-only replies wants that
// every time, not once per app start
let speakOn = localStorage.getItem(SPEAK_PREF) !== 'off';
let listening = false;
let ttsUnlocked = false;

/* ============ screen wake ============ */
let wakeLock = null;
async function keepAwake(){
  if (!('wakeLock' in navigator)) return;
  try { wakeLock = await navigator.wakeLock.request('screen'); } catch {}
}
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState === 'visible' && !wakeLock) keepAwake();
});

/* ============ orb state ============ */
function setState(s, text){
  document.body.className = s;
  if (text !== undefined) statusEl.textContent = text;
}
let ampVal = 0;
function applyAmp(){ orb.style.setProperty('--amp', ampVal.toFixed(3)); }
function pulse(v){ ampVal = Math.min(1, Math.max(ampVal, v)); applyAmp(); }
setInterval(() => { if (ampVal > .001){ ampVal *= .86; applyAmp(); } }, 55);

function idleHint(){
  if (MODE === 'none') return 'tap to type';
  return speakOn ? 'tap to speak' : 'tap to speak · text only';
}

/* ============ transcript ============ */

/* Is the reader following the live text, or have they scrolled back to read
   something? Pinning the view while they are reading is the rudest thing a
   transcript can do. 40px of slack absorbs momentum scrolling. */
const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 40;

/* Where to leave the view once a reply has finished arriving.

   Pinning to the bottom is right WHILE text streams — you watch it appear. It
   is wrong the moment it stops: a long answer has scrolled its own beginning
   off the top, so a first-aid procedure ends up showing step five with steps
   one to four above the fold and nothing saying so. On a wrist that is the
   difference between instructions and a fragment.

   So: always put the reply's FIRST line at the top of the view.

   Deliberately unconditional. The first attempt only did this when a single
   message was taller than the window, which turned out to miss the actual
   case — the answer had scrolled off the top through CUMULATIVE height, with
   no one message oversized. The browser clamps scrollTop for us, so a short
   reply with nothing below it simply stays where it is. */
function restAt(el){
  if (!el) return;
  log.scrollTop = Math.max(0, el.offsetTop - 10);
}

function bubble(role, text){
  const el = document.createElement('div');
  el.className = 'msg ' + role;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* ============ persistence ============
   iOS tears down home-screen web apps constantly. Without this, every glance
   at your wrist starts from an empty conversation. */
function saveHistory(){
  try { localStorage.setItem(STORE, JSON.stringify(history.slice(1))); } catch {}
}

/* How many leading turns the user has hidden from the screen. The model still
   has them; they are simply not repainted. Persisted, because otherwise
   clearing the screen would be undone by the next reload — and on iOS this
   app is torn down constantly, so that would happen within minutes. */
const CLEARED = 'orb.cleared.v1';
let cleared = parseInt(localStorage.getItem(CLEARED) || '0', 10) || 0;
function saveCleared(){
  try { localStorage.setItem(CLEARED, String(cleared)); } catch {}
}

function restoreHistory(){
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return;
    const arr = JSON.parse(raw);
    if (!Array.isArray(arr) || !arr.length) return;
    history = [history[0], ...arr];
    // Context is restored in full; only the hidden prefix is left unpainted.
    if (cleared > arr.length){ cleared = arr.length; saveCleared(); }
    for (const m of arr.slice(cleared)) bubble(m.role === 'user' ? 'user' : 'bot', m.content);
    log.scrollTop = log.scrollHeight;
  } catch {}
}

/* Tidy the screen, keep the conversation. Distinct from clearHistory below:
   the model can still refer back to anything hidden here. */
function clearScreen(){
  log.textContent = '';
  cleared = history.length - 1;      // everything so far, minus the system turn
  saveCleared();
  sfx('stop');
  setState('idle', 'screen cleared');
  setTimeout(() => { if (!busy && !listening) statusEl.textContent = idleHint(); }, 1400);
}

/* Start over: the model forgets too. Stored memories in /mem are untouched —
   those are facts about the user, not conversation. */
function clearHistory(){
  cancelSpeech();
  history = [history[0]];
  log.textContent = '';
  cleared = 0; saveCleared();
  try { localStorage.removeItem(STORE); } catch {}
  sfx('stop');
  setState('idle', 'new chat');
  setTimeout(() => { if (!busy && !listening) statusEl.textContent = idleHint(); }, 1500);
}

/* ============ audio out: tones ============ */
let sfxCtx = null;
// Must be created inside a user gesture on iOS. Server TTS plays through this
// same context, so it has to exist even when the user only ever types.
function ensureAudio(){
  try {
    sfxCtx = sfxCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (sfxCtx.state === 'suspended') sfxCtx.resume();
  } catch {}
  return sfxCtx;
}
// Voice-first on a wrist means acting without looking. A short tone confirming
// the mic opened or closed is the whole point.
function sfx(kind){
  try {
    ensureAudio();
    if (!sfxCtx) return;
    const t0 = sfxCtx.currentTime;
    const notes = kind === 'start' ? [660, 950]
                : kind === 'alarm' ? [880, 660, 880, 660, 880]
                : [880, 590];
    notes.forEach((f, n) => {
      const at = t0 + n * 0.085;
      const o = sfxCtx.createOscillator(), g = sfxCtx.createGain();
      o.type = 'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, at);
      g.gain.exponentialRampToValueAtTime(0.16, at + 0.012);
      g.gain.exponentialRampToValueAtTime(0.0001, at + 0.13);
      o.connect(g); g.connect(sfxCtx.destination);
      o.start(at); o.stop(at + 0.15);
    });
  } catch {}
}

/* ============ idle dim ============
   Tracked on documentElement, not body -- setState() rewrites body.className
   wholesale and would wipe the dim state on every transition. */
let idleTimer = 0;
function poke(){
  document.documentElement.classList.remove('dimmed');
  clearTimeout(idleTimer);
  idleTimer = setTimeout(() => {
    if (busy || listening || speakingNow()) return;
    document.documentElement.classList.add('dimmed');
  }, IDLE_MS);
}
// the tap that wakes the screen must not also open the mic
dimEl.addEventListener('click', (e) => { e.stopPropagation(); poke(); }, true);

/* ============ connection health ============ */
async function ping(){
  let ok = false;
  try { ok = (await fetch('/v1/models', { cache:'no-store' })).ok; } catch {}
  document.documentElement.classList.toggle('offline', !ok);
  if (!ok && !busy && !listening) statusEl.textContent = 'model unreachable';
  return ok;
}

/* ============ voice out ============
   server - Piper on the T470: one consistent female voice on any device
   device - the phone's own voice, instant, whatever it happens to be
   Server is probed once at startup; any failure drops to device for good. */
let ttsMode = 'device';
let speakingCount = 0;
let ttsChain = Promise.resolve();
let activeSrc = [];
let voice = null;

/* --- voice bank + synthetic colouring ---
   Piper serves several voices; the "voice" field picks one per request. The
   filter chain below is what gives the assistant-AI character: thinner low
   end, lifted presence and air, and a short detuned double for a digital
   shimmer. It is colouring, not impersonation — no model here reproduces any
   particular performer. */
// High-quality tier. libritts is multi-speaker: "voice libritts 42" picks a
// speaker id, so there are hundreds to hunt through without a rebuild.
// Local Piper only. edge-tts is gone: it was an undocumented endpoint and it
// sent reply text off the network, and no amount of voice-fitting was going to
// reach the target voice anyway. This is settled — lessac, clean, no effects.
const VOICES = {
  lessac:   'en_US-lessac-high',
  ljspeech: 'en_US-ljspeech-high',
  cori:     'en_GB-cori-high',
  libritts: 'en_US-libritts_r-medium',
};
const VOICE_PREF = 'orb.voice.v1';
const FX_PREF    = 'orb.fx.v2';
let voiceName = localStorage.getItem(VOICE_PREF) || 'lessac';
let speakerId = parseInt(localStorage.getItem('orb.speaker.v1') || '', 10);
if (!isFinite(speakerId)) speakerId = 0;

// Piper's length_scale: higher is SLOWER. Sent per request, so rate is
// adjustable live without rebuilding the image.
let voiceRate = parseFloat(localStorage.getItem('orb.rate.v1'));
// Measured on this voice: 1.0 -> 4.10 s for a test sentence, 1.25 -> ~4.8 s.
// Deliberate, not sluggish — the character is crisp and clipped, not slow.
if (!isFinite(voiceRate) || voiceRate < 0.6 || voiceRate > 2.0) voiceRate = 1.06;

// Two different knobs, and conflating them was a mistake:
//   noise_scale  - Piper calls this "generator noise". Raising it to fight a
//                  robotic sound adds audible hiss. Keep at or below Piper's
//                  0.667 default; lower still if there is background static.
//   noise_w      - varies phoneme DURATION, so the rhythm stops being
//                  metronomic. This is the actual anti-robotic control and it
//                  costs no noise at all.
let voiceNoise  = parseFloat(localStorage.getItem('orb.noise.v3'));
let voiceNoiseW = parseFloat(localStorage.getItem('orb.noisew.v3'));
// Target is a cool, precise, matter-of-fact machine voice (GLaDOS-adjacent),
// so LOW variation is correct: rhythm deliberately below Piper's 0.8 default
// for a measured, metronomic delivery, and noise low so "precise" does not
// come with hiss. Clean-robotic, not staticky-robotic.
// Back to 0.40 — the value in place when this last sounded acceptable.
// Dropping it to 0.30 for "clarity" made things worse, not better.
if (!isFinite(voiceNoise)  || voiceNoise  < 0.1 || voiceNoise  > 1.2) voiceNoise  = 0.40;
// Natural human rhythm. The target is a real voice delivered cleanly, so this
// sits near Piper's own default rather than the flat machine setting.
if (!isFinite(voiceNoiseW) || voiceNoiseW < 0.2 || voiceNoiseW > 1.6) voiceNoiseW = 0.85;
// Off by default. This chain has degraded the voice twice — thin and phasey,
// then crackly — and it is impossible to judge a voice through broken
// processing. Opt in with "voice robot more" once the clean voice is settled.
// Off. The audio path is now source -> analyser -> speakers, nothing between.
let fxOn      = localStorage.getItem(FX_PREF) === 'on';
let fxNodes   = null;
// 0 = untouched voice, 1 = full machine. Adjustable by ear with "voice robot".
let fxAmt     = parseFloat(localStorage.getItem('orb.fxamt.v1'));
if (!isFinite(fxAmt) || fxAmt < 0 || fxAmt > 1) fxAmt = 0;

// Separate from the robot amount. This is the JARVIS quality: a human voice
// that sounds like it is coming through a good system — even, articulate,
// controlled — with no synthetic timbre at all. Compression does most of the
// work; the "AI" impression is polish, not processing.
// Zero. Four separate attempts at processing this voice — synthetic sheen,
// ring modulator, broadcast polish, clarity lift — and every one was judged
// worse than the raw synthesiser. Key bumped to v2 so previously saved values
// are discarded rather than resurrecting a setting that was rejected.
let polishAmt = parseFloat(localStorage.getItem('orb.polish.v2'));
if (!isFinite(polishAmt) || polishAmt < 0 || polishAmt > 1) polishAmt = 0;

// A GLaDOS-style voice is not a clean voice with a little polish on it — it is
// a human recording through a vocoder. The previous chain (mild EQ, light
// chorus) was far too timid to read as a machine. This is the real recipe:
// ring modulation for the metallic buzz, a comb delay for resonance, and a
// comms-band filter so it sounds like it is coming through a speaker.
function buildFx(ctx){
  if (fxNodes && fxNodes.ctx === ctx && fxNodes.amt === fxAmt && fxNodes.pol === polishAmt)
    return fxNodes;

  const a      = Math.min(1, Math.max(0, fxAmt));      // machine character
  const p      = Math.min(1, Math.max(0, polishAmt));  // broadcast polish
  const input  = ctx.createGain();
  const output = ctx.createGain();

  // At a = 0 and p = 0 this chain is transparent. Rumble removal only.
  const hp = ctx.createBiquadFilter();
  hp.type = 'highpass'; hp.frequency.value = 70 + 160 * a; hp.Q.value = 0.6;
  const lp = ctx.createBiquadFilter();
  lp.type = 'lowpass';  lp.frequency.value = 20000 - 12000 * a; lp.Q.value = 0.6;

  // Articulation. Modest under polish, hard only if the machine amount is up.
  const pres = ctx.createBiquadFilter();
  pres.type = 'peaking'; pres.frequency.value = 2900; pres.Q.value = 1.0;
  pres.gain.value = 2.0 * p + 4.0 * a;

  // A little air reads as a clean, well-captured voice rather than a phone call
  const air = ctx.createBiquadFilter();
  air.type = 'highshelf'; air.frequency.value = 8000; air.gain.value = 2.5 * p * (1 - a);

  // --- ring modulator: the metallic voice-of-a-machine component ---
  // gain of 0 with an audio-rate oscillator driving .gain multiplies the two
  // signals, which is ring modulation rather than tremolo.
  const ring  = ctx.createGain(); ring.gain.value = 0;
  const rosc  = ctx.createOscillator();
  rosc.type = 'sine'; rosc.frequency.value = 48;      // low = buzz, not warble
  rosc.connect(ring.gain); rosc.start();

  // Comb delay with NO feedback loop. The previous 0.35 feedback path could
  // build up and self-oscillate, which is half of why it crackled.
  const comb = ctx.createDelay(0.05); comb.delayTime.value = 0.0062;

  // Ring mod is the strongest ingredient, so it enters squared — a small
  // setting stays a hint rather than a buzz.
  const dryG  = ctx.createGain(); dryG.gain.value  = 1 - 0.35 * a;
  const ringG = ctx.createGain(); ringG.gain.value = 0.45 * a * a;
  const combG = ctx.createGain(); combG.gain.value = 0.20 * a * a;

  // Headroom. Summing three paths at full gain overshot 1.0 and clipped at the
  // output — the other half of the crackle. Normalise by the total, then
  // compress gently rather than relying on the compressor to catch peaks.
  const total = dryG.gain.value + ringG.gain.value + combG.gain.value;
  const trim  = ctx.createGain(); trim.gain.value = 0.85 / Math.max(1, total);

  // This is what actually produces the "system voice" impression: even,
  // controlled level, the way a broadcast chain sounds. No synthetic timbre.
  const comp = ctx.createDynamicsCompressor();
  comp.threshold.value = -24 + 10 * (1 - p);
  comp.ratio.value     = 1 + 3 * p + 2 * a;
  comp.attack.value    = 0.004;
  comp.release.value   = 0.14;
  comp.knee.value      = 10;

  // No makeup gain above unity — that is what clipped and crackled. Leave
  // headroom instead and accept slightly lower level.
  const makeup = ctx.createGain(); makeup.gain.value = 0.9;

  input.connect(hp); hp.connect(lp); lp.connect(pres); pres.connect(air);
  air.connect(dryG);  dryG.connect(trim);
  if (a > 0){
    air.connect(ring); ring.connect(ringG); ringG.connect(trim);
    air.connect(comb); comb.connect(combG); combG.connect(trim);
  }
  trim.connect(comp); comp.connect(makeup); makeup.connect(output);

  fxNodes = { ctx, input, output, amt: fxAmt, pol: polishAmt };
  return fxNodes;
}

// Prefer a female English voice for the fallback path. iOS ships Samantha as
// the US female default; the rest cover other platforms.
function pickVoice(){
  if (!('speechSynthesis' in window)) return;
  const all = speechSynthesis.getVoices();
  if (!all.length) return;                       // fires again via onvoiceschanged
  const en = all.filter(v => /^en(-|_|$)/i.test(v.lang));
  const pool = en.length ? en : all;
  const prefer = [/samantha/i,/karen/i,/moira/i,/tessa/i,/serena/i,/fiona/i,
                  /female/i,/zira/i,/aria/i,/jenny/i];
  for (const p of prefer){
    const m = pool.find(v => p.test(v.name));
    if (m){ voice = m; return; }
  }
  voice = pool[0];
}
if ('speechSynthesis' in window){
  pickVoice();
  speechSynthesis.onvoiceschanged = pickVoice;
}

function speakingNow(){
  return speakingCount > 0 || !!(window.speechSynthesis && speechSynthesis.speaking);
}
function onSpeakStart(){
  speakingCount++;
  if (!busy) setState('speaking');
  pulse(.7);
}
function onSpeakEnd(){
  speakingCount = Math.max(0, speakingCount - 1);
  if (speakingCount === 0 && !busy && !(window.speechSynthesis && speechSynthesis.speaking)){
    setState('idle', idleHint());
  }
}
function cancelSpeech(){
  if (window.speechSynthesis) speechSynthesis.cancel();
  activeSrc.forEach(s => { try { s.stop(); } catch {} });
  activeSrc = [];
  ttsChain = Promise.resolve();
  speakingCount = 0;
}
function unlockTTS(){
  ensureAudio();
  if (ttsUnlocked || !('speechSynthesis' in window)) return;
  const u = new SpeechSynthesisUtterance(' ');
  u.volume = 0;
  speechSynthesis.speak(u);
  ttsUnlocked = true;
}

function speakDevice(text){
  if (!('speechSynthesis' in window)) return false;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 1.04;
  u.onstart = onSpeakStart;
  u.onend   = onSpeakEnd;
  u.onerror = onSpeakEnd;
  speechSynthesis.speak(u);
  return true;
}

let ttsFails = 0;

async function ttsFetchPlay(text, useName){
    const r = await fetch(TTS_API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({
        text,
        voice: VOICES[useName] || VOICES.lessac,
        length_scale: voiceRate,
        noise_scale: voiceNoise,
        length_w_scale: voiceNoiseW
      })
    });
    if (!r.ok) throw new Error('tts ' + r.status);
    const audio = await sfxCtx.decodeAudioData(await r.arrayBuffer());

    await new Promise(done => {
      const src = sfxCtx.createBufferSource();
      const an  = sfxCtx.createAnalyser();
      an.fftSize = 256;
      src.buffer = audio;
      if (fxOn){
        const fx = buildFx(sfxCtx);
        src.connect(fx.input);
        fx.output.connect(an);
      } else {
        src.connect(an);
      }
      an.connect(sfxCtx.destination);
      activeSrc.push(src);

      // the orb pulses to the real waveform here; the device path cannot
      const bins = new Uint8Array(an.frequencyBinCount);
      let over = false;
      (function meter(){
        if (over) return;
        an.getByteTimeDomainData(bins);
        let p = 0;
        for (let i = 0; i < bins.length; i++) p = Math.max(p, Math.abs(bins[i]-128)/128);
        pulse(Math.min(1, p * 2.2));
        requestAnimationFrame(meter);
      })();

      src.onended = () => {
        over = true;
        activeSrc = activeSrc.filter(s => s !== src);
        done();
      };
      src.start();
    });
}

function speakServer(text, asVoice){
  onSpeakStart();                     // claim the state before the fetch lands
  const useName = asVoice || voiceName;
  ttsChain = ttsChain.then(async () => {
    try {
      await ttsFetchPlay(text, useName);
      ttsFails = 0;
    } catch {
      // Piper restarts within a few seconds when it runs out of room loading a
      // second large voice. A transient restart must not disable server audio
      // for the rest of the session — retry once, then fall back only for this
      // line, and give up on the server entirely only after repeated failures.
      await new Promise(s => setTimeout(s, 2500));
      try {
        await ttsFetchPlay(text, useName);
        ttsFails = 0;
      } catch {
        ttsFails++;
        if (ttsFails >= 3) ttsMode = 'device';
        speakDevice(text);
      }
    }
    onSpeakEnd();
  });
  return true;
}

// Piper voices punctuation literally, so symbols get read out as words. Strip
// them on the way to the synthesiser only — the transcript keeps them.
function speakable(s){
  return s
    .replace(/https?:\/\/\S+/gi, 'a link')        // never read a URL aloud
    .replace(/[—–]+/g, ', ')            // em/en dash -> a spoken pause
    .replace(/\.{3,}|…/g, '. ')              // ellipsis
    .replace(/[•·]/g, ', ')             // bullets
    .replace(/&/g, ' and ')
    .replace(/@/g, ' at ')
    .replace(/%/g, ' percent ')
    .replace(/\+/g, ' plus ')
    .replace(/[=]/g, ' equals ')
    .replace(/[~`*_#^|\\<>{}\[\] ]/g, ' ')   // silent: never spoken
    .replace(/\/(?=\S)/g, ' or ')                 // "and/or" reads badly
    .replace(/[\u{1F300}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '')   // emoji
    .replace(/\s*-\s*/g, ' ')                     // stray hyphens between words
    .replace(/\s{2,}/g, ' ')
    .replace(/\s+([,.!?;:])/g, '$1')
    .trim();
}

function speak(text, asVoice){
  if (!speakOn || !text.trim()) return false;
  text = speakable(text);
  if (!text) return false;
  if (ttsMode === 'server' && sfxCtx && sfxCtx.state === 'running') return speakServer(text, asVoice);
  return speakDevice(text);
}

// Plays the same line in each single-speaker voice, one after another, so they
// can be compared back to back. libritts is excluded — it is one model with
// hundreds of speakers, walked with "voice next" instead.
function voiceDemo(){
  // Name first and on its own, so it is unmistakable which voice is speaking.
  // No model loading now that synthesis is remote, so this runs straight
  // through rather than pausing ~15 s per voice.
  const line = '{n}. This is {n}, reading a full sentence so you can judge the pacing.';
  for (const k of Object.keys(VOICES)) speak(line.replace(/\{n\}/g, k), k);
}

let ttsProbed = false;
async function probeTTS(){
  if (ttsProbed) return;
  ttsProbed = true;
  try {
    const r = await fetch(TTS_API, {
      method:'POST',
      headers:{ 'Content-Type':'application/json' },
      body: JSON.stringify({ text:'ok' })
    });
    if (!r.ok) return;
    // Check the bytes, not the header: Piper labels its WAV as text/html, and
    // a proxy misconfig returns 200 with an HTML error page.
    //
    // Must accept BOTH containers. edge-tts returns MP3 and Piper returns WAV;
    // a RIFF-only test silently concluded server audio was unavailable, so
    // every line fell back to the browser's one built-in voice — which is why
    // the demo sounded like a single voice reading everything.
    const buf = await r.arrayBuffer();
    if (buf.byteLength < 200) return;
    const u8  = new Uint8Array(buf, 0, 4);
    const sig = String.fromCharCode(u8[0], u8[1], u8[2], u8[3]);
    const isWav = sig === 'RIFF';
    const isMp3 = sig.slice(0, 3) === 'ID3' || (u8[0] === 0xFF && (u8[1] & 0xE0) === 0xE0);
    if (isWav || isMp3) ttsMode = 'server';
  } catch {}
}

/* ============ skills ============
   Things a 1.5B model does badly and a parser does perfectly: arithmetic,
   unit conversion, and timers. Handled here, before the model is invoked, so
   the answer is exact rather than plausible. Same principle as retrieval and
   memory — the model is never asked to decide whether to use these. */

/* --- safe arithmetic: tokenise and parse, never eval --- */
function calcEval(src){
  const s = src.replace(/[×x]/g, '*').replace(/[÷]/g, '/').replace(/,/g, '');
  if (!/^[\s\d.+\-*/^()%]+$/.test(s)) return null;      // strict whitelist
  const toks = s.match(/\d+(?:\.\d+)?|[+\-*/^()%]/g);
  if (!toks || !toks.length) return null;

  let i = 0;
  const peek = () => toks[i];
  const eat  = (t) => (toks[i] === t ? (i++, true) : false);

  function primary(){
    if (eat('(')){ const v = expr(); if (!eat(')')) throw 0; return v; }
    if (eat('-')) return -primary();
    if (eat('+')) return primary();
    const t = peek();
    if (t === undefined || !/^\d/.test(t)) throw 0;
    i++;
    return parseFloat(t);
  }
  function power(){
    const base = primary();
    if (eat('^')) return Math.pow(base, power());
    return base;
  }
  function term(){
    let v = power();
    for(;;){
      if (eat('*')) v *= power();
      else if (eat('/')){ const d = power(); if (d === 0) throw 0; v /= d; }
      else if (eat('%')){ const d = power(); v %= d; }
      else return v;
    }
  }
  function expr(){
    let v = term();
    for(;;){
      if (eat('+')) v += term();
      else if (eat('-')) v -= term();
      else return v;
    }
  }
  try {
    const v = expr();
    if (i !== toks.length || !isFinite(v)) return null;
    return v;
  } catch { return null; }
}

function fmtNum(n){
  if (!isFinite(n)) return String(n);
  const r = Math.abs(n) >= 1000 ? Math.round(n * 100) / 100
          : Math.abs(n) >= 1    ? Math.round(n * 1000) / 1000
          :                       Math.round(n * 100000) / 100000;
  return r.toLocaleString('en-GB', { maximumFractionDigits: 5 });
}

/* --- unit conversion --- */
const UNITS = {
  // length (base: metre)
  mm:['len',0.001], millimetre:['len',0.001], millimeter:['len',0.001],
  cm:['len',0.01], centimetre:['len',0.01], centimeter:['len',0.01],
  m:['len',1], metre:['len',1], meter:['len',1], metres:['len',1], meters:['len',1],
  km:['len',1000], kilometre:['len',1000], kilometer:['len',1000],
  in:['len',0.0254], inch:['len',0.0254], inches:['len',0.0254],
  ft:['len',0.3048], foot:['len',0.3048], feet:['len',0.3048],
  yd:['len',0.9144], yard:['len',0.9144], yards:['len',0.9144],
  mi:['len',1609.344], mile:['len',1609.344], miles:['len',1609.344],
  nmi:['len',1852], 'nautical mile':['len',1852],
  // mass (base: kilogram)
  mg:['mass',1e-6], g:['mass',0.001], gram:['mass',0.001], grams:['mass',0.001],
  kg:['mass',1], kilo:['mass',1], kilos:['mass',1], kilogram:['mass',1], kilograms:['mass',1],
  t:['mass',1000], tonne:['mass',1000], tonnes:['mass',1000],
  oz:['mass',0.0283495], ounce:['mass',0.0283495], ounces:['mass',0.0283495],
  lb:['mass',0.453592], lbs:['mass',0.453592], pound:['mass',0.453592], pounds:['mass',0.453592],
  st:['mass',6.35029], stone:['mass',6.35029],
  // volume (base: litre)
  ml:['vol',0.001], l:['vol',1], litre:['vol',1], liter:['vol',1], litres:['vol',1], liters:['vol',1],
  pint:['vol',0.568261], pints:['vol',0.568261],
  gallon:['vol',4.54609], gallons:['vol',4.54609],
  // speed (base: m/s)
  mph:['spd',0.44704], kmh:['spd',0.277778], kph:['spd',0.277778],
  'km/h':['spd',0.277778], 'm/s':['spd',1], knot:['spd',0.514444], knots:['spd',0.514444],
};
const TEMP = /^(c|celsius|centigrade|f|fahrenheit|k|kelvin)$/i;

function toBaseTemp(v, u){
  u = u[0].toLowerCase();
  return u === 'c' ? v + 273.15 : u === 'f' ? (v - 32) * 5/9 + 273.15 : v;
}
function fromBaseTemp(v, u){
  u = u[0].toLowerCase();
  return u === 'c' ? v - 273.15 : u === 'f' ? (v - 273.15) * 9/5 + 32 : v;
}

function convert(value, from, to){
  const f = from.toLowerCase().trim(), t = to.toLowerCase().trim();
  if (TEMP.test(f) && TEMP.test(t)){
    return { v: fromBaseTemp(toBaseTemp(value, f), t), unit: t };
  }
  const a = UNITS[f], b = UNITS[t];
  if (!a || !b || a[0] !== b[0]) return null;         // unknown or mismatched dimension
  return { v: value * a[1] / b[1], unit: t };
}

const RE_CONV1 = /^\s*(?:convert\s+)?(-?[\d.,]+)\s*([a-z°/]+(?:\s+mile)?)\s+(?:in|to|into)\s+([a-z°/]+(?:\s+mile)?)\s*\??\s*$/i;
const RE_CONV2 = /^\s*how many\s+([a-z°/]+)\s+(?:are\s+)?in\s+(-?[\d.,]+)\s*([a-z°/]+)\s*\??\s*$/i;
// Leading "(" must be allowed: "(120 + 30) / 4" is a perfectly ordinary thing
// to ask. The operator check below is what stops a bare number matching.
const RE_CALC  = /^\s*(?:what(?:'s| is)\s+|calculate\s+|=\s*)?([\d.,(][\d.,()\s+\-*/^%×x÷]*)\s*\??\s*$/i;

function skillConvert(text){
  let m = text.match(RE_CONV1);
  if (m){
    const r = convert(parseFloat(m[1].replace(/,/g,'')), m[2], m[3]);
    if (r) return fmtNum(parseFloat(m[1].replace(/,/g,''))) + ' ' + m[2] + ' is ' + fmtNum(r.v) + ' ' + m[3];
  }
  m = text.match(RE_CONV2);
  if (m){
    const r = convert(parseFloat(m[2].replace(/,/g,'')), m[3], m[1]);
    if (r) return fmtNum(parseFloat(m[2].replace(/,/g,''))) + ' ' + m[3] + ' is ' + fmtNum(r.v) + ' ' + m[1];
  }
  return null;
}

/* --- timers --- */
const TIMER_KEY = 'orb.timers.v1';
let timers = [];        // [{ at, label }]

function parseDuration(s){
  let total = 0, found = false;
  if (/\bhalf an hour\b/i.test(s)) return 1800;
  if (/\ban hour\b/i.test(s) && !/\d/.test(s)) return 3600;
  const re = /(\d+(?:\.\d+)?)\s*(hours?|hrs?|h|minutes?|mins?|m|seconds?|secs?|s)\b/gi;
  let m;
  while ((m = re.exec(s))){
    const v = parseFloat(m[1]), u = m[2][0].toLowerCase();
    total += v * (u === 'h' ? 3600 : u === 'm' ? 60 : 1);
    found = true;
  }
  return found ? Math.round(total) : 0;
}

function fmtDuration(sec){
  sec = Math.max(0, Math.round(sec));
  const h = Math.floor(sec/3600), m = Math.floor((sec%3600)/60), s = sec%60;
  const p = [];
  if (h) p.push(h + (h===1?' hour':' hours'));
  if (m) p.push(m + (m===1?' minute':' minutes'));
  if (s && !h) p.push(s + (s===1?' second':' seconds'));
  return p.join(' ') || '0 seconds';
}

function timersSave(){
  try { localStorage.setItem(TIMER_KEY, JSON.stringify(timers)); } catch {}
}
function timerFire(t){
  timers = timers.filter(x => x !== t);
  timersSave();
  poke();                                        // wake the screen
  sfx('alarm');
  const msg = t.label ? ('Timer: ' + t.label) : 'Timer finished.';
  bubble('bot', '⏰ ' + msg);
  speak(msg);
}
function timerArm(t){
  const delay = t.at - Date.now();
  if (delay <= 0){ timerFire(t); return; }
  t.id = setTimeout(() => timerFire(t), delay);
}
function timerAdd(sec, label){
  const t = { at: Date.now() + sec*1000, label: label || '' };
  timers.push(t); timersSave(); timerArm(t);
  return t;
}
function timersRestore(){
  try { timers = JSON.parse(localStorage.getItem(TIMER_KEY) || '[]') || []; } catch { timers = []; }
  for (const t of timers.slice()) timerArm(t);
}

const RE_TIMER  = /^\s*(?:set\s+(?:a\s+)?)?(?:timer|alarm)\s*(?:for\s+)?(.+?)\s*$/i;
const RE_REMIND = /^\s*remind me\s+(?:in|after)\s+(.+?)(?:\s+(?:to|about|that)\s+(.+))?\s*$/i;
const RE_TCANCEL= /^\s*(?:cancel|stop|clear)\s+(?:the\s+|all\s+)?(?:timers?|alarms?|reminders?)\s*$/i;
const RE_TLEFT  = /^\s*(?:how\s+long\s+(?:is\s+)?left|time\s+left|timers?\??)\s*\??\s*$/i;

// Returns a reply string if a skill handled it, else null.
function skillHandle(text){
  if (RE_TCANCEL.test(text)){
    const n = timers.length;
    timers.forEach(t => clearTimeout(t.id));
    timers = []; timersSave();
    return n ? ('Cancelled ' + n + (n===1?' timer.':' timers.')) : 'No timers running.';
  }
  if (RE_TLEFT.test(text)){
    if (!timers.length) return 'No timers running.';
    return timers.map(t => fmtDuration((t.at - Date.now())/1000) + ' left'
                          + (t.label ? ' on ' + t.label : '')).join('\n');
  }
  let m = text.match(RE_REMIND);
  if (m){
    const sec = parseDuration(m[1]);
    if (sec > 0){
      timerAdd(sec, m[2] || '');
      return 'Timer set for ' + fmtDuration(sec) + (m[2] ? ' — ' + m[2] : '') + '.';
    }
  }
  m = text.match(RE_TIMER);
  if (m){
    const sec = parseDuration(m[1]);
    if (sec > 0){ timerAdd(sec, ''); return 'Timer set for ' + fmtDuration(sec) + '.'; }
  }
  // voice bank controls, so the voice can be auditioned by ear on the device
  // "robotic" is a variation problem, not a voice problem: loosen noise_scale
  // and noise_w so pitch and rhythm stop being metronomic.
  // pitch-register matching on/off
  m = text.match(/^\s*voice\s+register\s*(on|off)?\s*$/i);
  if (m){
    if (m[1]) registerOn = (m[1].toLowerCase() === 'on');
    else registerOn = !registerOn;
    try { localStorage.setItem('orb.register.v1', registerOn ? 'on' : 'off'); } catch {}
    const shift = VOICE_F0[voiceName] !== undefined
      ? Math.round(TARGET_F0 - VOICE_F0[voiceName]) : 0;
    return 'Register matching ' + (registerOn ? 'on' : 'off')
         + (registerOn && shift ? ', shifting ' + voiceName + ' by ' + shift + ' hertz' : '')
         + '. This is how I sound now.';
  }

  // broadcast polish: even, controlled, "coming through a good system"
  m = text.match(/^\s*voice\s+polish\s*(more|less|off|[\d.]+)?\s*$/i);
  if (m){
    const a = (m[1] || 'more').toLowerCase();
    if (a === 'more')      polishAmt += 0.15;
    else if (a === 'less') polishAmt -= 0.15;
    else if (a === 'off')  polishAmt = 0;
    else if (!isNaN(parseFloat(a))) polishAmt = parseFloat(a);
    polishAmt = Math.min(1, Math.max(0, Math.round(polishAmt * 100) / 100));
    fxOn = (polishAmt > 0 || fxAmt > 0);
    fxNodes = null;
    try { localStorage.setItem('orb.polish.v2', String(polishAmt));
          localStorage.setItem(FX_PREF, fxOn ? 'on' : 'off'); } catch {}
    return 'Polish ' + Math.round(polishAmt * 100) + ' percent — evenness and clarity, '
         + 'no synthetic tone. This is how I sound now.';
  }

  // how machine-like the processing is: the main lever for the character
  m = text.match(/^\s*voice\s+robot\s*(more|less|off|max|[\d.]+)?\s*$/i);
  if (m){
    const a = (m[1] || 'more').toLowerCase();
    if (a === 'more')      fxAmt += 0.15;
    else if (a === 'less') fxAmt -= 0.15;
    else if (a === 'off')  fxAmt = 0;
    else if (a === 'max')  fxAmt = 1;
    else if (!isNaN(parseFloat(a))) fxAmt = parseFloat(a);
    fxAmt = Math.min(1, Math.max(0, Math.round(fxAmt * 100) / 100));
    fxOn = fxAmt > 0;
    fxNodes = null;                      // rebuild the graph at the new depth
    try { localStorage.setItem('orb.fxamt.v1', String(fxAmt));
          localStorage.setItem(FX_PREF, fxOn ? 'on' : 'off'); } catch {}
    return 'Machine processing ' + Math.round(fxAmt * 100) + ' percent. '
         + 'This is how I sound now. Say voice robot more, or voice robot less.';
  }

  // personality toggle — a safety valve if the attitude wears thin
  m = text.match(/^\s*persona\s+(on|off|status)\s*$/i);
  if (m){
    const a = m[1].toLowerCase();
    if (a !== 'status'){
      personaOn = (a === 'on');
      try { localStorage.setItem('orb.persona.v1', personaOn ? 'on' : 'off'); } catch {}
    }
    return personaOn
      ? 'Personality on. Try to keep up, second assistant.'
      : 'Personality off. Plain assistant mode.';
  }

  // rhythm only — fixes robotic delivery, adds no noise
  m = text.match(/^\s*voice\s+(warmer|flatter|natural|robotic)\s*$/i);
  if (m){
    const w = m[1].toLowerCase();
    const up = (w === 'warmer' || w === 'natural');
    voiceNoiseW = Math.min(1.6, Math.max(0.2,
                    Math.round((voiceNoiseW + (up ? 0.15 : -0.15)) * 100) / 100));
    try { localStorage.setItem('orb.noisew.v3', String(voiceNoiseW)); } catch {}
    return 'Rhythm variation ' + voiceNoiseW.toFixed(2)
         + ' — higher is less robotic, and this knob adds no hiss. '
         + 'This is how I sound now, over a longer sentence so the pacing shows.';
  }

  // timbre noise only — this is the one that causes background static
  m = text.match(/^\s*voice\s+(cleaner|clearer|noisier|hiss)\s*$/i);
  if (m){
    const w = m[1].toLowerCase();
    const up = (w === 'noisier' || w === 'hiss');
    voiceNoise = Math.min(1.2, Math.max(0.1,
                   Math.round((voiceNoise + (up ? 0.1 : -0.1)) * 100) / 100));
    try { localStorage.setItem('orb.noise.v3', String(voiceNoise)); } catch {}
    return 'Generator noise ' + voiceNoise.toFixed(2)
         + ' — lower means less background static. This is how I sound now.';
  }

  // speech rate: higher length_scale is slower
  m = text.match(/^\s*voice\s+(slower|faster|speed)\s*(-?[\d.]+)?\s*$/i);
  if (m){
    const w = m[1].toLowerCase();
    if (w === 'speed' && m[2]) voiceRate = parseFloat(m[2]);
    else if (w === 'slower') voiceRate += 0.15;
    else if (w === 'faster') voiceRate -= 0.15;
    voiceRate = Math.min(2.0, Math.max(0.6, Math.round(voiceRate * 100) / 100));
    try { localStorage.setItem('orb.rate.v1', String(voiceRate)); } catch {}
    return 'Speed ' + voiceRate.toFixed(2) + ' — higher is slower. This is how I sound now, '
         + 'speaking a full sentence so the pace is easy to judge.';
  }

  // "which one am I hearing?" — spoken in the voice itself, so it identifies
  // itself out loud rather than needing the screen.
  m = text.match(/^\s*voice\s+(who|which|current)\s*$/i);
  if (m){
    return 'I am ' + voiceName
         + (voiceName === 'libritts' ? ', speaker number ' + speakerId : '')
         + '. Speed ' + voiceRate.toFixed(2)
         + ', variation ' + voiceNoise.toFixed(2) + ' and ' + voiceNoiseW.toFixed(2) + '.';
  }

  m = text.match(/^\s*voice\s+(demo|test|compare)\s*$/i);
  if (m){
    setTimeout(voiceDemo, 60);        // let this reply's own speech queue first
    return 'Playing each voice in turn at speed ' + voiceRate.toFixed(2)
         + '. First use of each loads its model, so allow a few seconds between.';
  }

  m = text.match(/^\s*voice\s+(list|off|on|next|[a-z_]+)(?:\s+(\d{1,3}))?\s*$/i);
  if (m){
    const arg = m[1].toLowerCase();
    // "voice next" walks libritts speakers, for hunting by ear without typing
    if (arg === 'next'){
      voiceName = 'libritts';
      speakerId = (speakerId + 1) % 900;
      try { localStorage.setItem(VOICE_PREF, 'libritts');
            localStorage.setItem('orb.speaker.v1', String(speakerId)); } catch {}
      return 'Speaker ' + speakerId + '. This is how I sound now.';
    }
    if (arg === 'list') return 'Voices: ' + Object.keys(VOICES).join(', ')
                             + '. Current: ' + voiceName
                             + (voiceName === 'libritts' ? ' #' + speakerId : '')
                             + '. Speed ' + voiceRate.toFixed(2) + ' (higher is slower)'
                             + ', noise ' + voiceNoise.toFixed(2)
                             + ', rhythm ' + voiceNoiseW.toFixed(2)
                             + '. Say "voice warmer" if robotic, "voice cleaner" if there is '
                             + 'background static, "voice slower", or "voice demo" to compare.';
    if (arg === 'off' || arg === 'on'){
      fxOn = (arg === 'on');
      try { localStorage.setItem(FX_PREF, fxOn ? 'on' : 'off'); } catch {}
      fxNodes = null;
      return 'Synthetic effect ' + (fxOn ? 'on' : 'off') + '. This is how I sound now.';
    }
    if (VOICES[arg]){
      voiceName = arg;
      if (m[2] !== undefined) speakerId = parseInt(m[2], 10) || 0;
      try { localStorage.setItem(VOICE_PREF, arg);
            localStorage.setItem('orb.speaker.v1', String(speakerId)); } catch {}
      return 'Switched to ' + arg
           + (arg === 'libritts' ? ' speaker ' + speakerId : '')
           + '. This is how I sound now.';
    }
    return 'No voice called "' + arg + '". Try: ' + Object.keys(VOICES).join(', ');
  }

  const conv = skillConvert(text);
  if (conv) return conv;

  m = text.match(RE_CALC);
  if (m && /[+\-*/^%×x÷]/.test(m[1])){        // needs an operator, not just digits
    const v = calcEval(m[1]);
    if (v !== null) return m[1].trim().replace(/\s+/g,' ') + ' = ' + fmtNum(v);
  }
  return null;
}

/* ============ memory ============
   Durable facts about the user, injected into every request.

   Same principle as retrieval: the model does not decide what to remember.
   A 1.5B cannot reliably emit structured output or judge salience, so capture
   is deterministic — explicit commands plus a few high-precision patterns.
   Stored server-side via nginx WebDAV so it survives clearing site data. */
const MEM_DIR    = '/mem/';
const MEM_LOCAL  = 'orb.mem.v2';
const MEM_MAX    = 200;     // files
const MEM_INJECT = 8;       // short facts that may enter one prompt
const FACT_MAX   = 240;     // longer than this is a note, not a fact
const NOTE_CHARS = 900;     // excerpt budget for a retrieved note

// Every memory is one Markdown file. Short ones are facts (injected by
// relevance); long ones are notes (retrieved like Wikipedia, so a 2000-word
// project brief never lands in a 4k context wholesale).
let memories = [];          // [{ file, t, ts, note:bool, title }]
let memRemote = false;

function memParse(file, raw){
  let body = raw, ts = 0, title = '';
  const fm = raw.match(/^---\r?\n([\s\S]*?)\r?\n---\r?\n?/);
  if (fm){
    body = raw.slice(fm[0].length);
    const c = fm[1].match(/^created:\s*(.+)$/m);
    if (c) ts = Date.parse(c[1].trim()) || 0;
    const t = fm[1].match(/^title:\s*(.+)$/m);
    if (t) title = t[1].trim();
  }
  const h = body.match(/^#\s+(.+)$/m);
  if (!title && h) title = h[1].trim();
  body = body.replace(/^#\s+.+$/m, '').trim();
  if (!body) return null;
  if (!title) title = body.slice(0, 48).replace(/\s+\S*$/, '');
  return {
    file, ts: ts || Date.now(), title,
    t: body.replace(/\r/g, ''),
    note: body.length > FACT_MAX
  };
}

async function memLoad(){
  try {
    const r = await fetch(MEM_DIR, { cache:'no-store' });
    if (!r.ok) throw new Error('no listing');
    const entries = await r.json();                 // nginx autoindex_format json
    // Only the small files come down. Anything longer than a fact is a
    // document, and documents are searched server-side by /recall — the vault
    // is ~300 notes, and fetching all of them before the first question meant
    // 300 round trips over Tailscale on a phone.
    //
    // The size filter uses nginx's autoindex JSON, so it costs nothing extra.
    // FACT_MAX is a body limit and the file also carries frontmatter, hence
    // the allowance on top.
    const files = entries.filter(e => e.type === 'file' && /\.md$/i.test(e.name)
                                   && (e.size == null || e.size < FACT_MAX + 260))
                         .map(e => e.name)
                         .slice(0, MEM_MAX);
    const loaded = await Promise.all(files.map(async f => {
      try {
        const fr = await fetch(MEM_DIR + encodeURIComponent(f), { cache:'no-store' });
        return fr.ok ? memParse(f, await fr.text()) : null;
      } catch { return null; }
    }));
    memories = loaded.filter(Boolean).sort((a, b) => a.ts - b.ts);
    memRemote = true;
    try { localStorage.setItem(MEM_LOCAL, JSON.stringify(memories)); } catch {}
    return;
  } catch {}
  try { memories = JSON.parse(localStorage.getItem(MEM_LOCAL) || '[]') || []; } catch {}
}

function memSlug(text){
  const s = norm(text).trim().split(/\s+/).slice(0, 6).join('-').slice(0, 48) || 'note';
  return s + '-' + Date.now().toString(36) + '.md';
}

async function memWrite(m){
  const doc = '---\ncreated: ' + new Date(m.ts).toISOString() + '\n---\n\n' + m.t + '\n';
  try {
    const r = await fetch(MEM_DIR + encodeURIComponent(m.file), {
      method:'PUT', headers:{ 'Content-Type':'text/markdown' }, body: doc
    });
    memRemote = r.ok;
  } catch { memRemote = false; }
  try { localStorage.setItem(MEM_LOCAL, JSON.stringify(memories)); } catch {}
}

function memAdd(text){
  const t = text.trim().replace(/[ \t]+/g, ' ').replace(/[.\s]+$/, '');
  if (t.length < 3) return null;
  if (memories.some(m => norm(m.t) === norm(t))) return null;      // already known
  const m = { file: memSlug(t), t, ts: Date.now(),
              note: t.length > FACT_MAX, title: t.slice(0, 48) };
  memories.push(m);
  memWrite(m);
  return t;
}

async function memForget(query){
  const q = norm(query);
  const gone = memories.filter(m => norm(m.t).includes(q) || norm(m.title).includes(q));
  if (!gone.length) return 0;
  memories = memories.filter(m => !gone.includes(m));
  for (const m of gone){
    try { await fetch(MEM_DIR + encodeURIComponent(m.file), { method:'DELETE' }); } catch {}
  }
  try { localStorage.setItem(MEM_LOCAL, JSON.stringify(memories)); } catch {}
  return gone.length;
}

// Short facts: injected by term overlap, recency as tiebreak.
function memRelevant(query){
  const facts = memories.filter(m => !m.note);
  if (!facts.length) return [];
  if (facts.length <= MEM_INJECT) return facts;
  const terms = keyTerms(query);
  return facts
    .map((m, i) => ({ m, score: terms.filter(w => norm(m.t).includes(w)).length * 1000 + i }))
    .sort((a, b) => b.score - a.score)
    .slice(0, MEM_INJECT)
    .map(s => s.m);
}

// Long notes: retrieved, not always-injected. Same reasoning as the Wikipedia
// gate — an irrelevant note in the prompt is worse than no note.
async function memNote(query){
  // Server-side first: it holds the whole vault, does rarity-weighted whole-word
  // matching, and knows that "tls" names Transport Layer Security.
  try {
    const r = await fetch('/recall?q=' + encodeURIComponent(query), { cache:'no-store' });
    if (r.ok){
      const j = await r.json();
      if (j && j.hit) return { title: j.hit.title, text: j.hit.text };
    }
  } catch {}
  return memNoteLocal(query);
}

// Fallback: whatever notes this browser happens to hold. Only reachable if the
// router is unavailable, in which case a weaker search beats none.
function memNoteLocal(query){
  const notes = memories.filter(m => m.note);
  if (!notes.length) return null;
  const terms = keyTerms(query);
  if (!terms.length) return null;

  let best = null, bestScore = 0;
  for (const m of notes){
    const hay = norm(m.title + ' ' + m.t);
    let score = 0;
    for (const w of terms){
      if (norm(m.title).includes(w)) score += 3;   // title hits count for more
      else if (hay.includes(w)) score += 1;
    }
    if (score > bestScore){ bestScore = score; best = m; }
  }
  if (!best || bestScore < 3) return null;         // needs a real signal

  // excerpt around the first matching term rather than always the opening
  const body = best.t;
  const lc = norm(body);
  let at = 0;
  for (const w of terms){
    const i = lc.indexOf(w);
    if (i >= 0){ at = Math.max(0, i - 200); break; }
  }
  let text = body.slice(at, at + NOTE_CHARS);
  if (at > 0) text = '…' + text;
  if (at + NOTE_CHARS < body.length) text += '…';
  return { title: best.title, text };
}

/* ============ position ============
   The device knows where it is; nothing here asks a model about it. GPS works
   with no signal at all, which makes this the one capability that gets MORE
   useful as everything else degrades.

   Grid references are the point. Lat/long is fine on a screen but useless read
   over a radio to someone walking towards you — UK mountain rescue works in OS
   grid, so that is what this produces. */
const GEO_PIN = 'orb.pin.v1';
const GEO_TRAIL = 'orb.trail.v1';
const TRAIL_MAX = 60;              // ~a day of coarse breadcrumbs, not a tracker
let geoLast = null;                // {lat, lon, acc, alt, at}

/* WGS84 -> OS National Grid. Two steps that are easy to conflate: GPS reports
   WGS84, but the National Grid sits on the Airy 1830 ellipsoid under the
   OSGB36 datum. So a 7-parameter Helmert shift happens in cartesian space
   BEFORE the transverse Mercator projection. Projecting WGS84 directly lands
   ~100 m out — verified here at 77-125 m across Britain, which is exactly the
   distance between a grid reference and a wrong one.
   Checked against Ben Nevis, Scafell Pike and Snowdon: all exact to 6 figures. */
const _deg = Math.PI / 180;
function _toCart(lat, lon, a, b){
  const p = lat*_deg, l = lon*_deg, sp = Math.sin(p), cp = Math.cos(p);
  const e2 = (a*a - b*b)/(a*a), v = a/Math.sqrt(1 - e2*sp*sp);
  return { x:v*cp*Math.cos(l), y:v*cp*Math.sin(l), z:(1-e2)*v*sp };
}
function _toLL(p, a, b){
  const e2 = (a*a - b*b)/(a*a), lon = Math.atan2(p.y, p.x);
  const r = Math.hypot(p.x, p.y);
  let lat = Math.atan2(p.z, r*(1-e2)), prev;
  for (let i=0;i<20;i++){
    const s = Math.sin(lat), v = a/Math.sqrt(1 - e2*s*s);
    prev = lat; lat = Math.atan2(p.z + e2*v*s, r);
    if (Math.abs(lat-prev) < 1e-13) break;
  }
  return { lat: lat/_deg, lon: lon/_deg };
}
function _osgb36(lat, lon){
  const c = _toCart(lat, lon, 6378137, 6356752.3142);
  const sec = Math.PI/(180*3600), s = 20.4894e-6;
  const rx = -0.1502*sec, ry = -0.2470*sec, rz = -0.8421*sec;
  const t = {
    x: -446.448 + c.x*(1+s) - c.y*rz + c.z*ry,
    y:  125.157 + c.x*rz + c.y*(1+s) - c.z*rx,
    z: -542.060 - c.x*ry + c.y*rx + c.z*(1+s),
  };
  return _toLL(t, 6377563.396, 6356256.909);
}
function _grid(lat, lon){
  const a = 6377563.396, b = 6356256.909, F0 = 0.9996012717;
  const p0 = 49*_deg, l0 = -2*_deg, N0 = -100000, E0 = 400000;
  const e2 = 1 - (b*b)/(a*a), n = (a-b)/(a+b), n2 = n*n, n3 = n2*n;
  const p = lat*_deg, l = lon*_deg;
  const sp = Math.sin(p), cp = Math.cos(p), tp = Math.tan(p);
  const v = a*F0/Math.sqrt(1 - e2*sp*sp);
  const r = a*F0*(1-e2)/Math.pow(1 - e2*sp*sp, 1.5);
  const eta2 = v/r - 1;
  const M = b*F0*((1+n+1.25*n2+1.25*n3)*(p-p0)
    - (3*n+3*n2+2.625*n3)*Math.sin(p-p0)*Math.cos(p+p0)
    + (1.875*n2+1.875*n3)*Math.sin(2*(p-p0))*Math.cos(2*(p+p0))
    - (35/24)*n3*Math.sin(3*(p-p0))*Math.cos(3*(p+p0)));
  const c3 = cp**3, c5 = cp**5, t2 = tp**2, t4 = tp**4;
  const d = l-l0, d2 = d*d, d3 = d2*d, d4 = d3*d, d5 = d4*d, d6 = d5*d;
  return {
    E: E0 + v*cp*d + (v/6)*c3*(v/r - t2)*d3
       + (v/120)*c5*(5 - 18*t2 + t4 + 14*eta2 - 58*t2*eta2)*d5,
    N: M + N0 + (v/2)*sp*cp*d2 + (v/24)*sp*c3*(5 - t2 + 9*eta2)*d4
       + (v/720)*sp*c5*(61 - 58*t2 + t4)*d6,
  };
}
function gridRef(lat, lon, digits){
  digits = digits || 6;
  const o = _osgb36(lat, lon), g = _grid(o.lat, o.lon);
  if (g.E < 0 || g.E >= 700000 || g.N < 0 || g.N >= 1300000) return null;
  const e100 = Math.floor(g.E/100000), n100 = Math.floor(g.N/100000);
  let l1 = (19-n100) - ((19-n100) % 5) + Math.floor((e100+10)/5);
  let l2 = ((19-n100)*5) % 25 + (e100 % 5);
  if (l1 > 7) l1++;                      // the grid alphabet skips 'I'
  if (l2 > 7) l2++;
  const half = digits/2, div = Math.pow(10, 5-half);
  return String.fromCharCode(l1+65) + String.fromCharCode(l2+65) + ' '
       + String(Math.floor((g.E % 100000)/div)).padStart(half,'0') + ' '
       + String(Math.floor((g.N % 100000)/div)).padStart(half,'0');
}

// Great-circle distance and initial bearing. A compass point matters more than
// the number when it is being heard rather than read.
const COMPASS = ['north','north-east','east','south-east','south','south-west','west','north-west'];
function geoDelta(from, to){
  const R = 6371000;
  const p1 = from.lat*_deg, p2 = to.lat*_deg, dp = (to.lat-from.lat)*_deg, dl = (to.lon-from.lon)*_deg;
  const h = Math.sin(dp/2)**2 + Math.cos(p1)*Math.cos(p2)*Math.sin(dl/2)**2;
  const dist = 2*R*Math.asin(Math.min(1, Math.sqrt(h)));
  const y = Math.sin(dl)*Math.cos(p2);
  const x = Math.cos(p1)*Math.sin(p2) - Math.sin(p1)*Math.cos(p2)*Math.cos(dl);
  const brg = (Math.atan2(y, x)/_deg + 360) % 360;
  return { dist, brg, point: COMPASS[Math.round(brg/45) % 8] };
}
const niceDist = (m) => m < 1000 ? Math.round(m/10)*10 + ' metres'
                                 : (m/1000).toFixed(m < 10000 ? 1 : 0) + ' kilometres';
// Digits spoken singly, as they would be over a radio: "one six six", not
// "one hundred and sixty six".
const sayGrid = (g) => g ? g.replace(/([A-Z])(?=[A-Z])/g, '$1 ').replace(/\d/g, '$& ') : '';

function getPosition(maxAgeMs){
  return new Promise((resolve, reject) => {
    if (!navigator.geolocation) return reject(new Error('unsupported'));
    if (geoLast && Date.now() - geoLast.at < (maxAgeMs || 20000)) return resolve(geoLast);
    navigator.geolocation.getCurrentPosition(
      (p) => {
        geoLast = { lat:p.coords.latitude, lon:p.coords.longitude,
                    acc:p.coords.accuracy, alt:p.coords.altitude, at:Date.now() };
        trailPush(geoLast);
        resolve(geoLast);
      },
      (e) => reject(e),
      { enableHighAccuracy:true, timeout:15000, maximumAge:10000 });
  });
}

// Breadcrumbs, coarsely: a point every 50 m at most. Dense tracking would be a
// different product and a battery problem.
function trailPush(fix){
  try {
    const t = JSON.parse(localStorage.getItem(GEO_TRAIL) || '[]');
    const last = t[t.length-1];
    if (last && geoDelta(last, fix).dist < 50) return;
    t.push({ lat:fix.lat, lon:fix.lon, at:fix.at });
    while (t.length > TRAIL_MAX) t.shift();
    localStorage.setItem(GEO_TRAIL, JSON.stringify(t));
  } catch {}
}

function geoFailure(e){
  // Safari gates geolocation on a secure context exactly as it does the mic,
  // so the plain-http LAN address cannot do this even though dictation can.
  if (!navigator.geolocation) return 'This browser has no location support.';
  if (!window.isSecureContext) return 'Location needs the https address. Plain http cannot ask for it.';
  if (e && e.code === 1) return 'Location permission is denied. Allow it in site settings.';
  if (e && e.code === 3) return 'No fix yet. Under open sky it usually takes a few seconds.';
  return 'No position available.';
}

/* Nearest named place, from the offline dataset on the server. Not a street
   address: reverse geocoding to a house number needs either someone else's
   server (which is exactly what cannot be relied on out here) or a full OSM
   extract this box has no room for. "600 metres north-east of Seathwaite" can
   be walked to, which a postcode cannot. */
let placeLast = null;

async function lookupPlace(f){
  try {
    const r = await fetch('/place?lat=' + f.lat + '&lon=' + f.lon, { cache:'no-store' });
    if (!r.ok) return null;
    const j = await r.json();
    return j && j.nearest ? j : null;
  } catch { return null; }
}

// The lookup returns the bearing FROM the fix TO the place. Saying "you are
// north of X" needs the opposite, or every direction is reported backwards.
function relativeTo(p){
  const back = (p.bearing + 180) % 360;
  const dir = COMPASS[Math.round(back/45) % 8];
  return p.distance_m < 100 ? 'at ' + p.name
                            : niceDist(p.distance_m) + ' ' + dir + ' of ' + p.name;
}

async function describePosition(){
  const f = await getPosition();
  const g = gridRef(f.lat, f.lon);
  placeLast = await lookupPlace(f);

  const bits = [];
  if (placeLast && placeLast.address){
    // A street address supersedes the nearest-place phrasing — it already
    // carries the locality, so repeating "600 m west of X" only pads it. The
    // town stays out for the same reason.
    bits.push('You are at ' + placeLast.address + '.');
  } else if (placeLast){
    let s = 'You are ' + relativeTo(placeLast.nearest);
